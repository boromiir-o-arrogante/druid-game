<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost in Blackwood - Hardcore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; background-color: #020617; color: #e2e8f0; font-family: 'Courier New', monospace; overflow: hidden; }
    .death-screen { animation: fadeIn 2s forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .shake { animation: shake 0.2s; }
    @keyframes shake { 0% { transform: translate(1px, 1px); } 50% { transform: translate(-2px, -1px); } 100% { transform: translate(0, 0); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const EMOJIS = { 
      wall: "🌲", floor: "·", player: "👦", goblin: "👹", 
      slime: "🦠", orc: "🧌", bat: "🦇", fog: "⬛", 
      stairs: "🪜", fruit: "🍎", boss: "👿" 
    };
    
    const ENEMY_TYPES = [
      { type: 'bat', hp: 4, xp: 1, dmg: 1, name: 'Morcego' },
      { type: 'slime', hp: 6, xp: 2, dmg: 2, name: 'Slime' },
      { type: 'goblin', hp: 10, xp: 4, dmg: 3, name: 'Goblin' },
      { type: 'orc', hp: 20, xp: 8, dmg: 5, name: 'Orc' }
    ];

    const MAP_W = 24; const MAP_H = 14; const VISION = 5;

    const isVisible = (x, y, p) => {
      const dx = Math.abs(x - p.x), dy = Math.abs(y - p.y);
      return (dx <= 1 && dy <= 1) || (dx <= VISION && dy <= VISION && 
        ((p.f === 'UP' && y < p.y && dx <= dy) || (p.f === 'DOWN' && y > p.y && dx <= Math.abs(dy)) ||
         (p.f === 'LEFT' && x < p.x && dy <= dx) || (p.f === 'RIGHT' && x > p.x && dy <= Math.abs(dx))));
    };

    const generateMap = (floor) => {
      let map = [];
      for (let y = 0; y < MAP_H; y++) {
        let row = [];
        for (let x = 0; x < MAP_W; x++) {
          const isWall = x === 0 || y === 0 || x === MAP_W - 1 || y === MAP_H - 1 || (Math.random() < 0.18 && x > 3);
          row.push({ x, y, t: isWall ? 'wall' : 'floor', e: null, v: false });
        }
        map.push(row);
      }

      // Frutas raras (Dificuldade aumentada)
      map.forEach(r => r.forEach(c => {
        if (c.t === 'floor' && Math.random() < 0.015) c.e = { type: 'fruit' };
      }));

      // Boss do Andar (Chance de 70% de ter um boss)
      if (Math.random() < 0.7) {
        let bx = Math.floor(Math.random() * 10) + 10, by = Math.floor(Math.random() * 10) + 2;
        map[by][bx].e = { type: 'boss', hp: 30 + (floor * 15), maxHp: 30 + (floor * 15), dmg: 5 + floor, xp: 20, name: 'Guardião' };
      }

      // Inimigos comuns
      for (let i = 0; i < 6 + floor; i++) {
        let rx = Math.floor(Math.random() * (MAP_W-2)) + 1, ry = Math.floor(Math.random() * (MAP_H-2)) + 1;
        if (map[ry][rx].t === 'floor' && !map[ry][rx].e) {
          const base = ENEMY_TYPES[Math.floor(Math.random() * Math.min(floor, 4))];
          map[ry][rx].e = { ...base, hp: base.hp + (floor * 2), dmg: base.dmg + Math.floor(floor/2) };
        }
      }

      map[MAP_H-2][MAP_W-2].t = 'stairs';
      return map;
    };

    function App() {
      const [floor, setFloor] = useState(1);
      const [p, setP] = useState({ x: 2, y: 2, hp: 25, max: 25, atk: 4, f: 'DOWN', xp: 0, lvl: 1, sp: 0 });
      const [map, setMap] = useState(() => generateMap(1));
      const [log, setLog] = useState(["Blackwood não perdoa os fracos..."]);

      const updateAI = (currentMap, playerPos) => {
        let newMap = currentMap.map(r => r.map(c => ({...c})));
        let damageTaken = 0;

        for (let y = 0; y < MAP_H; y++) {
          for (let x = 0; x < MAP_W; x++) {
            const cell = currentMap[y][x];
            if (cell.e && cell.e.type !== 'player' && cell.e.type !== 'fruit') {
              // Movimento simples em direção ao player
              let dx = playerPos.x - x, dy = playerPos.y - y;
              let nextX = x + (dx !== 0 ? dx / Math.abs(dx) : 0);
              let nextY = y + (dy !== 0 ? dy / Math.abs(dy) : 0);

              if (nextX === playerPos.x && nextY === playerPos.y) {
                damageTaken += cell.e.dmg || 1;
              } else if (newMap[nextY][nextX].t === 'floor' && !newMap[nextY][nextX].e) {
                newMap[nextY][nextX].e = {...cell.e};
                newMap[y][x].e = null;
              }
            }
          }
        }
        return { newMap, damageTaken };
      };

      const move = (dx, dy) => {
        if (p.hp <= 0 || p.sp > 0) return;
        let nx = p.x + dx, ny = p.y + dy;
        let nf = dx > 0 ? 'RIGHT' : dx < 0 ? 'LEFT' : dy > 0 ? 'DOWN' : 'UP';
        
        if (nx < 0 || nx >= MAP_W || ny < 0 || ny >= MAP_H) return;
        const target = map[ny][nx];
        if (target.t === 'wall') { setP(prev => ({...prev, f: nf})); return; }

        let newLog = [];
        let newP = { ...p, x: nx, y: ny, f: nf };

        // Combate ou Interação
        if (target.e) {
          if (target.e.type === 'fruit') {
            newP.hp = Math.min(newP.hp + 4, newP.max);
            newLog.push("🍎 Fruta amarga... (+4 HP)");
            target.e = null;
          } else {
            // Player ataca
            target.e.hp -= p.atk;
            newLog.push(`Você feriu o ${target.e.name}!`);
            if (target.e.hp <= 0) {
              newP.xp += target.e.xp || 2;
              newLog.push(`Morte confirmada! +${target.e.xp} XP`);
              target.e = null;
              if (newP.xp >= newP.lvl * 10) { newP.lvl++; newP.sp++; }
            }
            newP.x = p.x; newP.y = p.y; // Fica parado ao atacar
          }
        }

        // Turno dos Monstros (Eles perseguem e batem)
        const aiResult = updateAI(map, {x: newP.x, y: newP.y});
        newP.hp -= aiResult.damageTaken;
        if (aiResult.damageTaken > 0) newLog.push(`⚠️ Emboscada! Você perdeu ${aiResult.damageTaken} HP`);

        // Escada
        if (target.t === 'stairs' && !target.e) {
          const nextF = floor + 1;
          setFloor(nextF);
          setMap(generateMap(nextF));
          setP({...newP, x: 2, y: 2});
          setLog(["Você desceu mais fundo...", ...log]);
          return;
        }

        if (newP.hp <= 0) newLog.push("💀 A floresta consumiu sua alma.");
        
        setLog(prev => [...newLog, ...prev].slice(0, 8));
        setMap(aiResult.newMap);
        setP(newP);
      };

      useEffect(() => {
        const h = (e) => {
          const k = {w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
          if (k[e.key]) { e.preventDefault(); move(...k[e.key]); }
        };
        window.addEventListener('keydown', h);
        return () => window.removeEventListener('keydown', h);
      }, [p, map]);

      return (
        <div className="flex flex-col items-center justify-center min-h-screen p-4 bg-slate-950">
          <div className="mb-4 text-center">
            <h1 className="text-red-600 text-3xl font-black tracking-tighter shadow-red-900">LOST IN BLACKWOOD</h1>
            <div className="text-xs text-slate-600 font-bold uppercase tracking-[0.4em]">Andar da Agonia: {floor}</div>
          </div>

          <div className="flex flex-col xl:flex-row gap-6">
            {/* MAPA */}
            <div className="bg-black p-1 border-4 border-red-900/30 rounded-lg shadow-2xl overflow-hidden shadow-red-900/10">
              {map.map((row, y) => (
                <div key={y} className="flex">
                  {row.map((c, x) => {
                    const vis = isVisible(x, y, p);
                    if (vis) c.v = true;
                    let char = "⬛"; let op = "opacity-0";
                    if (vis) { char = p.x===x && p.y===y ? EMOJIS.player : (c.e ? EMOJIS[c.e.type] : EMOJIS[c.t]); op="opacity-100"; }
                    else if (c.v) { char = EMOJIS[c.t]; op="opacity-10 grayscale"; }
                    return <div key={x} className={`w-8 h-8 flex items-center justify-center text-xl ${op}`}>{char}</div>;
                  })}
                </div>
              ))}
            </div>

            {/* PAINEL */}
            <div className="w-full xl:w-72 flex flex-col gap-4">
              <div className="bg-slate-900 border-2 border-red-900 p-4 rounded-lg">
                <div className="flex justify-between text-[10px] font-bold text-red-500 mb-1 italic">
                  <span>SINAIS VITAIS</span>
                  <span>NVL {p.lvl}</span>
                </div>
                <div className="w-full bg-black h-4 rounded-sm border border-red-900/50 overflow-hidden">
                  <div className="bg-red-700 h-full transition-all" style={{width:`${(p.hp/p.max)*100}%`}}></div>
                </div>
                <div className="flex justify-between text-[10px] mt-2 font-bold text-slate-400">
                  <span>HP: {p.hp}/{p.max}</span>
                  <span>XP: {p.xp}</span>
                </div>
                <div className="mt-4 grid grid-cols-2 gap-2">
                  <div className="bg-black p-2 border border-slate-800 text-[10px] text-center">ATQ: <span className="text-orange-600">{p.atk}</span></div>
                  <div className="bg-black p-2 border border-slate-800 text-[10px] text-center">DIF: <span className="text-red-600">H HARD</span></div>
                </div>
              </div>

              {/* MINI MAPA PREMIUM */}
              <div className="bg-slate-900 p-2 border border-slate-800 rounded-lg">
                <div className="text-[8px] text-slate-500 mb-2 font-bold uppercase tracking-widest text-center">Monitor de Área</div>
                <div className="bg-black p-1 rounded-sm grid" style={{gridTemplateColumns:`repeat(${MAP_W}, 1fr)`}}>
                  {map.map((row, y) => row.map((c, x) => {
                    let color = "bg-transparent";
                    if (c.v) {
                      if (p.x===x && p.y===y) color = "bg-emerald-500 shadow-[0_0_3px_#10b981]";
                      else if (c.e && isVisible(x,y,p)) color = c.e.type==='boss' ? "bg-purple-600 animate-ping" : "bg-red-600";
                      else if (c.t==='wall') color = "bg-slate-800";
                      else color = "bg-slate-900";
                    }
                    return <div key={`${x}-${y}`} className={`w-1.5 h-1.5 ${color} rounded-[1px]`}></div>;
                  }))}
                </div>
              </div>

              <div className="bg-black/50 p-3 rounded border border-red-900/20 h-40 overflow-hidden text-[9px] italic">
                {log.map((m, i) => <div key={i} className={i===0?"text-red-400 font-bold":"text-slate-600"}>{i===0?"» ":""}{m}</div>)}
              </div>
            </div>
          </div>

          {p.hp <= 0 && (
            <div className="fixed inset-0 bg-black/90 flex flex-col items-center justify-center z-[100] death-screen p-6">
              <h2 className="text-6xl text-red-700 font-black mb-4">VOCÊ MORREU</h2>
              <p className="text-slate-500 mb-8 italic text-center">Blackwood reclamou o que é dela. Você chegou ao Andar {floor}.</p>
              <button onClick={()=>window.location.reload()} className="px-8 py-3 bg-red-900 text-white font-bold hover:bg-red-700 transition-colors rounded-full uppercase tracking-widest">Tentar Novamente</button>
            </div>
          )}

          {p.sp > 0 && (
            <div className="fixed inset-0 bg-black/95 flex items-center justify-center z-50 p-4">
              <div className="bg-slate-900 border-2 border-red-600 p-8 rounded-lg text-center max-w-xs w-full shadow-[0_0_50px_rgba(220,38,38,0.3)]">
                <h2 className="text-2xl text-red-500 font-black mb-6 uppercase tracking-tighter">Sobrevivência</h2>
                <button onClick={()=>setP(prev=>({...prev, max:prev.max+8, hp:prev.hp+8, sp:prev.sp-1}))} className="w-full mb-4 bg-red-900/20 border border-red-600 text-red-500 py-4 rounded hover:bg-red-600 hover:text-white font-bold transition-all uppercase text-xs">Vigor (+8 HP)</button>
                <button onClick={()=>setP(prev=>({...prev, atk:prev.atk+2, sp:prev.sp-1}))} className="w-full bg-slate-800 border border-slate-600 text-slate-300 py-4 rounded hover:bg-slate-200 hover:text-black font-bold transition-all uppercase text-xs">Ataque (+2 Atk)</button>
              </div>
            </div>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>

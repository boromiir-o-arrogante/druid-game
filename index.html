<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost in Blackwood - Hall of Legends</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; background-color: #020617; color: #f8fafc; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
    .hp-gradient { background: linear-gradient(90deg, #991b1b 0%, #dc2626 100%); transition: width 0.5s ease; }
    .xp-gradient { background: linear-gradient(90deg, #1e3a8a 0%, #3b82f6 100%); transition: width 0.5s ease; }
    .shake { animation: shakeAnim 0.2s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes shakeAnim { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
    .flash-lvl { animation: flashAnim 0.5s ease-out; }
    @keyframes flashAnim { 0% { background-color: rgba(59, 130, 246, 0.5); } 100% { background-color: transparent; } }
    .minimap-bg { background-color: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 6px; box-shadow: inset 0 0 10px #000; }
    @keyframes pulse-purple { 0%, 100% { transform: scale(1); background-color: #a855f7; } 50% { transform: scale(1.3); background-color: #e879f9; } }
    .animate-boss-radar { animation: pulse-purple 0.8s infinite; border-radius: 50%; }
    .milestone-card { background: rgba(15, 23, 42, 0.8); border: 1px solid #1e293b; transition: all 0.3s; }
    .unlocked { border-color: #fbbf24; box-shadow: 0 0 15px rgba(251, 191, 36, 0.2); background: rgba(251, 191, 36, 0.05); }
  </style>
</head>
<body class="select-none text-slate-200">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    const EMOJIS = { wall: "🌲", floor: "·", player: "👦", goblin: "👹", slime: "🦠", orc: "🧌", bat: "🦇", stairs: "🪜", fruit: "🍎", boss: "👿", blood: "🩸" };
    
    const CLASSES = [
      { id: 'exp', name: 'Explorador', icon: '👦', stats: { hp: 45, max: 45, atk: 5, range: 2, vis: 8, def: 0 } },
      { id: 'war', name: 'Guerreiro', icon: '🛡️', stats: { hp: 70, max: 70, atk: 6, range: 1, vis: 5, def: 2 } },
      { id: 'hun', name: 'Caçador', icon: '🏹', stats: { hp: 35, max: 35, atk: 11, range: 1, vis: 6, def: 0 } }
    ];

    const MAP_W = 24; const MAP_H = 14; 
    const ENEMY_BASE = [{ type: 'bat', hp: 12, xp: 10, dmg: 4, name: 'Morcego' }, { type: 'slime', hp: 18, xp: 12, dmg: 5, name: 'Slime' }, { type: 'goblin', hp: 30, xp: 20, dmg: 8, name: 'Goblin' }];

    const generateLevel = (floor) => {
      let map = [];
      const pStart = { x: 2, y: 2 };
      let sPos = { x: 20, y: 10 }; 
      for (let y = 0; y < MAP_H; y++) {
        let row = [];
        for (let x = 0; x < MAP_W; x++) {
          const isBorder = x === 0 || y === 0 || x === MAP_W - 1 || y === MAP_H - 1;
          const isInTunnel = (y === pStart.y && x <= sPos.x) || (x === sPos.x && y >= pStart.y);
          const isWall = isBorder || (Math.random() < 0.16 && !isInTunnel && !(x === pStart.x && y === pStart.y));
          row.push({ x, y, t: isWall ? 'wall' : 'floor', e: null, v: false, b: false });
        }
        map.push(row);
      }
      map[sPos.y][sPos.x].t = 'stairs';
      map.forEach(r => r.forEach(c => { if(c.t === 'floor' && Math.random() < 0.04 && c.x > 3 && c.t !== 'stairs') c.e = { type: 'fruit' }; }));
      for (let i = 0; i < 6 + (floor * 2); i++) {
        let rx = Math.floor(Math.random() * (MAP_W-2)) + 1, ry = Math.floor(Math.random() * (MAP_H-2)) + 1;
        if (map[ry][rx].t === 'floor' && !map[ry][rx].e && (Math.abs(rx - pStart.x) > 4)) {
          const base = ENEMY_BASE[Math.floor(Math.random() * ENEMY_BASE.length)];
          const hp = base.hp + (floor * 5);
          map[ry][rx].e = { ...base, hp, maxHp: hp, dmg: base.dmg + Math.floor(floor * 1.5) };
        }
      }
      return map;
    };

    function App() {
      const [charClass, setCharClass] = useState(null);
      const [p, setP] = useState(null);
      const [floor, setFloor] = useState(1);
      const [map, setMap] = useState([]);
      const [inventory, setInventory] = useState([]);
      const [isDead, setIsDead] = useState(false);
      const [combo, setCombo] = useState(0);
      const [shake, setShake] = useState(false);
      const [flash, setFlash] = useState(false);
      const [showMilestones, setShowMilestones] = useState(false);

      const [meta, setMeta] = useState(() => {
        const saved = localStorage.getItem('bw_meta_v2');
        return saved ? JSON.parse(saved) : { totalKills: 0, maxFloor: 0, maxLevel: 0 };
      });

      const applyMilestones = (stats) => {
        let bonus = { atk: 0, vis: 0, hp: 0 };
        if (meta.totalKills >= 50) bonus.atk += 2;
        if (meta.totalKills >= 200) bonus.atk += 5;
        if (meta.maxFloor >= 15) bonus.vis += 1;
        if (meta.maxFloor >= 30) bonus.vis += 2;
        if (meta.maxLevel >= 10) bonus.hp += 20;
        if (meta.maxLevel >= 25) bonus.hp += 50;
        return { 
          ...stats, 
          atk: stats.atk + bonus.atk, 
          vis: stats.vis + bonus.vis, 
          max: stats.max + bonus.hp, 
          hp: stats.hp + bonus.hp 
        };
      };

      const start = (selectedClass) => {
        const initialP = applyMilestones({ ...selectedClass.stats, x: 2, y: 2, xp: 0, lvl: 1, sp: 0, f: 'DOWN' });
        setP(initialP);
        setCharClass(selectedClass);
        setMap(generateLevel(1));
        setFloor(1);
        setIsDead(false);
        setInventory([]);
      };

      const isVisible = (x, y, player) => {
        if (!player) return false;
        const dx = x - player.x, dy = y - player.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 1.6) return true;
        if (dist > player.vis) return false;
        const angle = Math.atan2(dy, dx);
        let targetAngle = player.f === 'UP' ? -Math.PI/2 : player.f === 'DOWN' ? Math.PI/2 : player.f === 'LEFT' ? Math.PI : 0;
        let diff = Math.abs(angle - targetAngle);
        if (diff > Math.PI) diff = 2*Math.PI - diff;
        return diff < 0.8;
      };

      const move = (dx, dy) => {
        if (!p || isDead || p.sp > 0) return;
        const nx = p.x + dx, ny = p.y + dy;
        const nf = dx > 0 ? 'RIGHT' : dx < 0 ? 'LEFT' : dy > 0 ? 'DOWN' : 'UP';
        
        let targetE = null;
        for (let r = 1; r <= p.range; r++) {
          let tx = p.x + (dx * r), ty = p.y + (dy * r);
          if (map[ty]?.[tx]?.e && !['fruit'].includes(map[ty][tx].e.type)) { targetE = { x: tx, y: ty, e: map[ty][tx].e }; break; }
          if (map[ty]?.[tx]?.t === 'wall') break;
        }

        if (targetE) {
          targetE.e.hp -= (combo >= 3 ? p.atk * 2 : p.atk);
          if (targetE.e.hp <= 0) {
            map[targetE.y][targetE.x].b = true; 
            const newMeta = { ...meta, totalKills: meta.totalKills + 1 };
            setMeta(newMeta);
            localStorage.setItem('bw_meta_v2', JSON.stringify(newMeta));
            let nXp = p.xp + targetE.e.xp;
            if (nXp >= p.lvl * 40) { 
               nXp -= (p.lvl * 40); 
               const nLvl = p.lvl + 1;
               if (nLvl > meta.maxLevel) {
                 const m = {...newMeta, maxLevel: nLvl};
                 setMeta(m); localStorage.setItem('bw_meta_v2', JSON.stringify(m));
               }
               setP(v => ({...v, xp: nXp, lvl: nLvl, sp: v.sp + 1, f: nf}));
               setFlash(true); setTimeout(()=>setFlash(false), 500);
            } else { setP(v => ({...v, xp: nXp, f: nf})); }
            setCombo(c => c + 1); map[targetE.y][targetE.x].e = null;
          } else { setP(v => ({...v, f: nf})); }
          processAI(p.x, p.y); return;
        }

        const cell = map[ny]?.[nx];
        if (!cell || cell.t === 'wall') { setP(prev => ({...prev, f: nf})); return; }
        if (cell.t === 'stairs') {
          const nF = floor + 1; setFloor(nF);
          if (nF > meta.maxFloor) {
            const m = {...meta, maxFloor: nF};
            setMeta(m); localStorage.setItem('bw_meta_v2', JSON.stringify(m));
          }
          setMap(generateLevel(nF)); setP(v => ({...v, x: 2, y: 2, f: 'DOWN'}));
          return;
        }
        if (cell.e?.type === 'fruit') {
          if (inventory.length < 3) setInventory(v => [...v, 'apple']);
          else setP(v => ({...v, hp: Math.min(v.max, v.hp + 15)}));
          cell.e = null;
        }
        setP(v => ({...v, x: nx, y: ny, f: nf}));
        processAI(nx, ny);
      };

      const processAI = (px, py) => {
        let dmg = 0;
        const newMap = map.map(row => row.map(c => {
          if (c.e && !['fruit'].includes(c.e.type)) {
            const dx = Math.abs(px - c.x), dy = Math.abs(py - c.y);
            if (dx <= 1 && dy <= 1) { dmg += Math.max(1, c.e.dmg - p.def); }
            else if (Math.random() > 0.5) {
              const sx = c.x + (px > c.x ? 1 : px < c.x ? -1 : 0), sy = c.y + (py > c.y ? 1 : py < c.y ? -1 : 0);
              if (map[sy]?.[sx]?.t === 'floor' && !map[sy][sx].e && !(sx === px && sy === py)) 
                return { ...c, e: null, next: { ...c.e, nx: sx, ny: sy } };
            }
          }
          return c;
        }));
        if (dmg > 0) setCombo(0);
        if (dmg > 8) { setShake(true); setTimeout(()=>setShake(false), 200); }
        newMap.forEach(r => r.forEach(c => { if(c.next) { newMap[c.next.ny][c.next.nx].e = c.next; delete c.next; } }));
        setMap(newMap); 
        const fHp = p.hp - dmg;
        if (fHp <= 0) setIsDead(true);
        setP(v => ({ ...v, hp: fHp }));
      };

      useEffect(() => {
        const h = (e) => {
          if (e.key.toLowerCase() === 'h' && p && inventory.length > 0) { 
             setInventory(v => v.slice(1)); setP(v => ({...v, hp: Math.min(v.max, v.hp + 20)})); 
          }
          const k = {w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
          if (k[e.key]) move(...k[e.key]);
        };
        window.addEventListener('keydown', h);
        return () => window.removeEventListener('keydown', h);
      }, [p, map, inventory, isDead, combo]);

      if (!charClass) return (
        <div className="flex flex-col items-center justify-center min-h-screen bg-slate-950 p-6 overflow-y-auto">
          <h1 className="text-5xl font-black text-red-600 mb-8 italic uppercase tracking-tighter">Lost in Blackwood</h1>
          
          <div className="flex gap-4 mb-10">
            <button onClick={() => setShowMilestones(false)} className={`px-6 py-2 rounded-full text-xs font-bold uppercase transition ${!showMilestones ? 'bg-red-600 text-white' : 'bg-slate-900 text-slate-500'}`}>Herdeiros</button>
            <button onClick={() => setShowMilestones(true)} className={`px-6 py-2 rounded-full text-xs font-bold uppercase transition ${showMilestones ? 'bg-yellow-600 text-white' : 'bg-slate-900 text-slate-500'}`}>Mural de Glória</button>
          </div>

          {!showMilestones ? (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-4xl">
              {CLASSES.map(c => (
                <button key={c.id} onClick={() => start(c)} className="bg-slate-900 border-2 border-slate-800 p-8 rounded-3xl hover:border-red-600 transition-all group">
                  <div className="text-6xl mb-4 group-hover:scale-110 transition-transform">{c.icon}</div>
                  <h3 className="text-xl font-bold uppercase">{c.name}</h3>
                  <p className="text-[10px] text-slate-500 mt-2 font-bold uppercase tracking-widest">Reivindicar Sangue</p>
                </button>
              ))}
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 w-full max-w-5xl">
              {[
                { name: 'Exterminador I', target: 50, val: meta.totalKills, desc: '+2 ATK Base', icon: '💀' },
                { name: 'Exterminador II', target: 200, val: meta.totalKills, desc: '+5 ATK Base', icon: '⚔️' },
                { name: 'Explorador I', target: 15, val: meta.maxFloor, desc: '+1 Visão Base', icon: '👁️' },
                { name: 'Explorador II', target: 30, val: meta.maxFloor, desc: '+2 Visão Base', icon: '🗺️' },
                { name: 'Veterano', target: 10, val: meta.maxLevel, desc: '+20 HP Base', icon: '🩸' },
                { name: 'Imortal', target: 25, val: meta.maxLevel, desc: '+50 HP Base', icon: '👑' },
              ].map((m, i) => (
                <div key={i} className={`p-4 rounded-2xl milestone-card ${m.val >= m.target ? 'unlocked' : 'opacity-40'}`}>
                  <div className="text-2xl mb-2">{m.icon}</div>
                  <p className="text-xs font-black uppercase text-white">{m.name}</p>
                  <p className="text-[10px] text-slate-400 mt-1">{m.desc}</p>
                  <div className="w-full bg-black h-1.5 rounded-full mt-3 overflow-hidden">
                    <div className="bg-yellow-500 h-full" style={{width: `${Math.min(100, (m.val/m.target)*100)}%`}}></div>
                  </div>
                  <p className="text-[8px] mt-1 text-right font-bold text-yellow-600">{m.val}/{m.target}</p>
                </div>
              ))}
            </div>
          )}

          <button onClick={() => { if(confirm("Apagar Linhagem?")) { localStorage.clear(); window.location.reload(); } }} className="mt-12 text-[10px] uppercase font-bold text-red-900 hover:text-red-500 transition-colors">Resetar Progresso Eterno</button>
        </div>
      );

      return (
        <div className={`flex flex-col items-center justify-center min-h-screen p-4 ${flash ? 'flash-lvl' : ''}`}>
          <div className={`flex flex-col lg:flex-row gap-6 ${shake ? 'shake' : ''}`}>
            <div className="bg-black border-4 border-slate-900 p-1 rounded-2xl shadow-2xl overflow-hidden relative">
              {map.map((row, y) => (
                <div key={y} className="flex">
                  {row.map((c, x) => {
                    const vis = isVisible(x, y, p); if (vis) c.v = true;
                    let ch = "⬛"; let op = "opacity-0";
                    if (vis) { ch = p.x===x && p.y===y ? charClass.icon : (c.e ? EMOJIS[c.e.type] : (c.b ? EMOJIS.blood : EMOJIS[c.t])); op="opacity-100"; }
                    else if (c.v) { ch = c.b ? EMOJIS.blood : EMOJIS[c.t]; op="opacity-10 grayscale"; }
                    return (
                      <div key={x} className="relative w-8 h-8 md:w-9 md:h-9 flex items-center justify-center text-xl">
                        <div className={op}>{ch}</div>
                        {c.e && vis && c.e.hp < c.e.maxHp && <div className="absolute -top-1 w-7 h-1 bg-black rounded-full overflow-hidden border border-slate-800"><div className="h-full bg-red-600" style={{width:`${(c.e.hp/c.e.maxHp)*100}%`}}></div></div>}
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>

            <div className="w-full lg:w-72 flex flex-col gap-4 font-mono">
              <div className="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-xl font-bold text-[10px]">
                <div className="flex justify-between text-red-500 uppercase mb-1"><span>Integridade</span><span>{Math.max(0, p.hp)}/{p.max}</span></div>
                <div className="w-full bg-black h-3 rounded-full overflow-hidden border border-slate-800 p-0.5 mb-4 shadow-inner"><div className="hp-gradient h-full rounded-full" style={{width:`${Math.max(0,(p.hp/p.max)*100)}%`}}></div></div>
                <div className="bg-slate-800/80 p-3 rounded-xl border border-slate-700 text-center mb-4">
                   <p className="text-emerald-400 mb-1 text-[8px] uppercase tracking-widest font-black italic">Mochila: {inventory.length}/3 | Combo: {combo}/3</p>
                   <div className="flex justify-center gap-1">{inventory.map((_,i)=><span key={i}>🍎</span>)}</div>
                   <p className="text-white text-[8px] mt-1 animate-pulse">[H] CURAR</p>
                </div>
                <div className="flex justify-between text-blue-500 uppercase mb-1"><span>Legado NV {p.lvl}</span><span>{Math.floor(p.xp)}/{p.lvl*40}</span></div>
                <div className="w-full bg-black h-2 rounded-full border border-slate-800 p-0.5 shadow-inner"><div className="xp-gradient h-full rounded-full" style={{width:`${(p.xp/(p.lvl*40))*100}%`}}></div></div>
              </div>
              <div className="minimap-bg flex justify-center p-3">
                <div className="grid gap-[1px]" style={{gridTemplateColumns: `repeat(${MAP_W}, 1fr)`}}>
                  {map.map((row, y) => row.map((c, x) => {
                    let col = "bg-transparent";
                    if (c.v) {
                      if (p.x===x && p.y===y) col = "bg-emerald-400 shadow-[0_0_5px_#34d399]";
                      else if (c.e && isVisible(x,y,p)) col = "bg-red-600";
                      else if (c.t==='stairs') col = "bg-yellow-400";
                      else if (c.t==='wall') col = "bg-slate-700";
                      else col = "bg-slate-900";
                    }
                    return <div key={`${x}-${y}`} className={`w-[6px] h-[6px] rounded-[1px] ${col}`}></div>;
                  }))}
                </div>
              </div>
              <div className="bg-slate-900 p-3 rounded-2xl border border-slate-800 text-[9px] uppercase font-bold text-slate-500 italic">Andar {floor} | Total Kills: {meta.totalKills}</div>
            </div>
          </div>

          {p.sp > 0 && (
            <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-[40]">
              <div className="bg-slate-900 border-2 border-red-600 p-8 rounded-3xl text-center max-w-xs w-full shadow-2xl">
                <h2 className="text-xl text-red-500 font-black mb-6 uppercase italic tracking-tighter">Evolução de Sangue</h2>
                <button onClick={()=>{ setP(v=>({...v, max:v.max+10, hp:v.max+10, sp:v.sp-1})); }} className="w-full mb-4 bg-red-900/20 border border-red-600 text-red-500 py-4 rounded-2xl hover:bg-red-600 hover:text-white font-bold uppercase text-xs">Vitalidade (+10 HP)</button>
                <button onClick={()=>{ setP(v=>({...v, atk:v.atk+3, sp:v.sp-1})); }} className="w-full bg-slate-800 border border-slate-700 text-slate-300 py-4 rounded-2xl hover:bg-slate-200 hover:text-black font-bold uppercase text-xs">Força (+3 ATK)</button>
              </div>
            </div>
          )}

          {isDead && (
            <div className="fixed inset-0 bg-black/95 flex flex-col items-center justify-center z-[100] p-6 text-center">
              <h2 className="text-7xl text-red-800 font-black mb-4 uppercase italic tracking-tighter">Caiu</h2>
              <p className="text-slate-500 mb-8 italic uppercase text-xs tracking-widest">Sua linhagem permanece.</p>
              <button onClick={() => start(charClass)} className="px-12 py-4 bg-red-900 text-white font-black hover:bg-red-700 transition-all rounded-full border-2 border-red-600 shadow-lg uppercase tracking-widest">Assumir Herança</button>
            </div>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>

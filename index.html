<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lost in Blackwood - Detailed Pixel Art</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. TEMA GLOBAL
       ========================================================================== */
    body { 
      margin: 0; background-color: #1a1c23; color: #fde0b2; 
      font-family: 'VT323', monospace; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
    }
    #scale-wrapper { 
      transition: transform 0.2s ease-out; transform-origin: center center; 
      image-rendering: pixelated; 
    }

    /* ==========================================================================
       2. INTERFACE (MADEIRA E PEDRA)
       ========================================================================== */
    .wood-panel {
      background-color: #3e2723; border: 4px solid #1c100a;
      box-shadow: inset 0 0 0 4px #5d4037, 8px 8px 0px rgba(0,0,0,0.5);
    }
    .stone-panel {
      background-color: #374151; border: 4px solid #111827;
      box-shadow: inset 0 0 0 4px #4b5563, 6px 6px 0px rgba(0,0,0,0.5);
    }
    .hud-box {
      background-color: #271c19; border: 2px solid #1c100a; box-shadow: inset 2px 2px 0px #111;
    }
    
    .hp-bar-solid { background-color: #dc2626; border-right: 2px solid #991b1b; transition: width 0.3s steps(10); } 
    .xp-bar-solid { background-color: #3b82f6; border-right: 2px solid #1e3a8a; transition: width 0.3s steps(10); }

    .shake-fx { animation: shakeAnim 0.35s steps(4) both; } 
    @keyframes shakeAnim { 0% { transform: translate3d(0, 0, 0); } 33% { transform: translate3d(-6px, 4px, 0); } 66% { transform: translate3d(6px, -4px, 0); } 100% { transform: translate3d(0, 0, 0); } }
    .flash-lvl { animation: flashAnim 0.6s steps(2) forwards; display: block; }
    @keyframes flashAnim { 0% { background-color: rgba(251, 191, 36, 0.7); } 50% { background-color: transparent; } 100% { background-color: transparent; } }

    /* ==========================================================================
       3. O MAPA E O CENÁRIO (PIXEL ART CSS)
       ========================================================================== */
    .map-container {
      background-color: #111; border: 6px solid #1c100a;
      box-shadow: inset 0 0 0 4px #3e2723, 10px 10px 0px rgba(0,0,0,0.6);
    }
    .tile { width: 40px; height: 40px; position: relative; display: flex; align-items: center; justify-content: center; }
    
    /* Chão de Grama Detalhado */
    .tile-grass { 
      background-color: #5b8a29; 
      background-image: radial-gradient(#4d7522 15%, transparent 16%), radial-gradient(#6da632 15%, transparent 16%);
      background-size: 8px 8px, 16px 16px;
      background-position: 0 0, 4px 4px;
      border: 1px solid rgba(0,0,0,0.1);
    }
    
    /* Árvores Detalhadas (Pinheiros) */
    .tile-tree { background-color: #5b8a29; position: relative; overflow: visible; }
    .tile-tree::before { /* Tronco */
      content: ''; position: absolute; bottom: 2px; left: 16px; width: 8px; height: 12px; 
      background: #4e342e; border: 2px solid #211512; border-bottom: none; z-index: 1;
    }
    .tile-tree::after { /* Copa 3D com triângulos CSS */
      content: ''; position: absolute; bottom: 8px; left: 0; width: 0; height: 0; 
      border-left: 20px solid transparent; border-right: 20px solid transparent; border-bottom: 28px solid #2e7d32;
      filter: drop-shadow(0 2px 0 #1b5e20); z-index: 2; 
    }

    /* Escada (Alçapão de Madeira) */
    .tile-stairs { background: #5b8a29; }
    .stairs-door { 
      width: 32px; height: 32px; background: #8d6e63; border: 4px solid #3e2723; 
      position: relative; box-shadow: inset 0 0 0 2px #5d4037; 
      background-image: repeating-linear-gradient(90deg, transparent, transparent 6px, #5d4037 6px, #5d4037 8px);
    }
    .stairs-door::after { content:''; position:absolute; top:12px; right:4px; width:6px; height:6px; background:#111; border-radius: 50%; }

    .fog-overlay { position: absolute; inset: 0; background-color: #0f131a; opacity: 0.85; z-index: 20; }

    /* ==========================================================================
       4. SPRITES PIXEL ART (CSS PURO)
       ========================================================================== */
    .spr { position: relative; z-index: 10; display: flex; align-items: center; justify-content: center; }
    
    /* Guerreiro (Armadura Prateada e Visor em Cruz) */
    .spr-war { width: 24px; height: 26px; background: #cbd5e1; border: 2px solid #334155; box-shadow: inset -4px -4px 0 #94a3b8; }
    .spr-war::after { content: ''; position: absolute; top: 4px; left: 8px; width: 4px; height: 12px; background: #0f172a; box-shadow: -4px 4px 0 #0f172a, 4px 4px 0 #0f172a; } 

    /* Arqueiro (Capuz Verde) */
    .spr-arc { width: 24px; height: 26px; background: #22c55e; border: 2px solid #064e3b; border-radius: 12px 12px 0 0; box-shadow: inset -4px -4px 0 #166534; }
    .spr-arc::after { content: ''; position: absolute; top: 6px; left: 4px; width: 12px; height: 4px; background: #0f172a; border-radius: 2px; } /* Olhos na sombra do capuz */

    /* Explorador (Manto e Lanterna) */
    .spr-exp { width: 24px; height: 26px; background: #7e22ce; border: 2px solid #3b0764; box-shadow: inset -4px -4px 0 #581c87; }
    .spr-exp::after { content: ''; position: absolute; bottom: 4px; right: -4px; width: 8px; height: 8px; background: #facc15; border-radius: 50%; border: 1px solid #ca8a04; box-shadow: 0 0 10px #fef08a; } 
    
    /* Slime (Geleia Transparente com Núcleo) */
    .spr-slime { width: 26px; height: 20px; background: rgba(6, 182, 212, 0.8); border: 2px solid #083344; border-radius: 12px 12px 4px 4px; margin-top: 8px; box-shadow: inset -4px -4px 0 rgba(2, 132, 199, 0.8); }
    .spr-slime::after { content: ''; position: absolute; top: 6px; left: 6px; width: 4px; height: 4px; background: #fff; box-shadow: 8px 0 0 #fff; } /* Olhinhos brancos */

    /* Goblin (Orelhas Pontudas) */
    .spr-goblin { width: 22px; height: 22px; background: #65a30d; border: 2px solid #14532d; box-shadow: inset -4px -4px 0 #3f6212; }
    .spr-goblin::after { content: ''; position: absolute; top: 2px; left: 4px; width: 4px; height: 2px; background: #000; box-shadow: 8px 0 0 #000; } /* Olhos ruins */
    .spr-goblin::before { content: ''; position: absolute; top: -2px; left: -6px; width: 6px; height: 6px; background: #65a30d; border: 2px solid #14532d; box-shadow: 28px 0 0 -2px #14532d, 28px 0 0 0 #65a30d; } /* Orelhas */

    /* Morcego (Asas e Olhos Vermelhos) */
    .spr-bat { width: 30px; height: 12px; background: #334155; border: 2px solid #0f172a; border-radius: 50%; box-shadow: inset -2px -4px 0 #1e293b; }
    .spr-bat::after { content: ''; position: absolute; top: 2px; left: 8px; width: 2px; height: 2px; background: #ef4444; box-shadow: 8px 0 0 #ef4444, 0 0 4px #ef4444; }

    /* Boss (Demônio Gigante) */
    .spr-boss { width: 34px; height: 34px; background: #991b1b; border: 2px solid #450a0a; box-shadow: inset -6px -6px 0 #7f1d1d; border-radius: 8px 8px 0 0; }
    .spr-boss::after { content: ''; position: absolute; top: -8px; left: 2px; width: 8px; height: 12px; background: #facc15; border: 2px solid #450a0a; border-radius: 4px 4px 0 0; box-shadow: 20px 0 0 -2px #450a0a, 20px 0 0 0 #facc15; } /* Chifres */
    .spr-boss::before { content: ''; position: absolute; top: 12px; left: 6px; width: 6px; height: 4px; background: #000; box-shadow: 14px 0 0 #000; } /* Olhos grandes */

    /* Itens e Sangue */
    .spr-fruit { width: 16px; height: 16px; background: #ef4444; border: 2px solid #450a0a; border-radius: 6px; position: relative; box-shadow: inset -2px -2px 0 #991b1b; }
    .spr-fruit::after { content:''; position:absolute; top:-6px; right:2px; width:6px; height:8px; background:#22c55e; border:2px solid #064e3b; border-radius: 2px; }
    .spr-blood { width: 22px; height: 12px; background: #7f1d1d; border-radius: 40% 60% 70% 30%; opacity: 0.8; }
  </style>
</head>
<body class="select-none">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const CLASSES = [
      { id: 'exp', name: 'EXPLORADOR', iconClass: 'spr-exp', desc: 'Furtivo. Maior visão do jogo.', stats: { hp: 45, max: 45, atk: 5, range: 1, vis: 8, def: 0 } },
      { id: 'war', name: 'GUERREIRO', iconClass: 'spr-war', desc: 'Espada varre 3 blocos em arco.', stats: { hp: 70, max: 70, atk: 5, range: 1, vis: 5, def: 2 } },
      { id: 'arc', name: 'ARQUEIRO', iconClass: 'spr-arc', desc: 'Flecha perfura linha reta inteira.', stats: { hp: 35, max: 35, atk: 7, range: 4, vis: 6, def: 0 } }
    ];
    const MAP_W = 24; const MAP_H = 14; 
    const ENEMIES = [{ type: 'bat', hp: 12, xp: 10, dmg: 4 }, { type: 'slime', hp: 18, xp: 12, dmg: 5 }, { type: 'goblin', hp: 30, xp: 20, dmg: 8 }];
    const POWER_CATALOG = [
      { id: 'atk_dmg', name: 'FORÇA', icon: '⚔️', desc: '+2 Dano' },
      { id: 'atk_rng', name: 'ALCANCE', icon: '🏹', desc: '+1 Alcance' },
      { id: 'atk_lch', name: 'DRENAR', icon: '🩸', desc: 'Cura no Atq' },
      { id: 'def_res', name: 'COURAÇA', icon: '🛡️', desc: '-1 Dano Rec.' },
      { id: 'def_rfl', name: 'ESPINHOS', icon: '✨', desc: 'Reflete Dano' },
      { id: 'hp_reg', name: 'REGEN', icon: '❤️', desc: 'Cura / Andar' }
    ];

    const calcVis = (x, y, player) => {
      if (!player) return false;
      const dx = x - player.x, dy = y - player.y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 1.5) return true;
      if (dist > player.vis) return false;
      const angle = Math.atan2(dy, dx);
      let targetAngle = player.f === 'UP' ? -Math.PI/2 : player.f === 'DOWN' ? Math.PI/2 : player.f === 'LEFT' ? Math.PI : 0;
      let diff = Math.abs(angle - targetAngle);
      if (diff > Math.PI) diff = 2*Math.PI - diff;
      return diff < 0.8;
    };

    const generateLevel = (f, playerRef) => {
      let m = [];
      for (let y = 0; y < MAP_H; y++) {
        let row = [];
        for (let x = 0; x < MAP_W; x++) {
          const isBorder = x === 0 || y === 0 || x === MAP_W - 1 || y === MAP_H - 1;
          const isWall = isBorder || (Math.random() < 0.16 && x > 4 && !(y===2 && x < 15));
          row.push({ x, y, t: isWall ? 'wall' : 'floor', e: null, v: false, b: false });
        }
        m.push(row);
      }
      m[11][21].t = 'stairs';
      m.forEach(r => r.forEach(c => { if(c.t === 'floor' && Math.random() < 0.04 && c.x > 5) c.e = { type: 'fruit' }; }));
      
      for (let i = 0; i < 6 + (f * 2); i++) {
        let rx = Math.floor(Math.random() * (MAP_W-4)) + 3, ry = Math.floor(Math.random() * (MAP_H-4)) + 2;
        if (m[ry][rx].t === 'floor' && !m[ry][rx].e) {
          const b = ENEMIES[Math.floor(Math.random() * ENEMIES.length)];
          m[ry][rx].e = { type: b.type, hp: b.hp + (f*5), maxHp: b.hp + (f*5), dmg: b.dmg + Math.floor(f*1.5), xp: b.xp + (f*2) };
        }
      }
      if (Math.random() < 0.3) {
        let bx = 12, by = 6;
        if (m[by] && m[by][bx] && m[by][bx].t === 'floor') {
          m[by][bx].e = { type: 'boss', hp: 100+(f*30), maxHp: 100+(f*30), dmg: 10+f, xp: 150 };
        }
      }
      if (playerRef) {
        m.forEach(r => r.forEach(c => { if(calcVis(c.x, c.y, playerRef)) c.v = true; }));
      }
      return m;
    };

    function App() {
      const [charClass, setCharClass] = useState(null);
      const [p, setP] = useState(null);
      const [floor, setFloor] = useState(1);
      const [map, setMap] = useState([]);
      const [inventory, setInventory] = useState([]);
      const [activePowers, setActivePowers] = useState([]);
      const [isDead, setIsDead] = useState(false);
      const [combo, setCombo] = useState(0);
      const [shakeKey, setShakeKey] = useState(0);
      const [flashKey, setFlashKey] = useState(0);
      const [offered, setOffered] = useState([]);
      const [showMilestones, setShowMilestones] = useState(false);
      const [scale, setScale] = useState(1);
      
      const [meta, setMeta] = useState(() => {
        try {
          const saved = localStorage.getItem('bw_meta_pixel_v7');
          return saved ? JSON.parse(saved) : { totalKills: 0, maxFloor: 0, maxLevel: 0, legacyHP: 0, legacyATK: 0, legacyPowers: [] };
        } catch(e) { return { totalKills: 0, maxFloor: 0, maxLevel: 0, legacyHP: 0, legacyATK: 0, legacyPowers: [] }; }
      });

      useEffect(() => {
        const handleResize = () => {
          const gameW = 1400; const gameH = 700;
          const sw = window.innerWidth / gameW;
          const sh = window.innerHeight / gameH;
          setScale(Math.min(sw, sh, 1.0)); 
        };
        handleResize();
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const start = (sel) => {
        const bonusHP = (meta.legacyHP || 0) + (meta.maxLevel >= 10 ? 20 : 0) + (meta.maxLevel >= 25 ? 50 : 0);
        const bonusATK = (meta.legacyATK || 0) + (meta.totalKills >= 50 ? 2 : 0) + (meta.totalKills >= 200 ? 5 : 0);
        const bonusVIS = (meta.maxFloor >= 15 ? 1 : 0) + (meta.maxFloor >= 30 ? 2 : 0);
        
        const initialP = { 
          ...sel.stats, max: sel.stats.max + bonusHP, hp: sel.stats.max + bonusHP,
          atk: sel.stats.atk + bonusATK, vis: sel.stats.vis + bonusVIS,
          x: 2, y: 2, xp: 0, lvl: 1, sp: 0, f: 'DOWN' 
        };
        
        const validPowers = (meta.legacyPowers || []).filter(pow => POWER_CATALOG.find(x => x.id === pow.id));
        setCharClass(sel); setP(initialP); setActivePowers(validPowers);
        setMap(generateLevel(1, initialP)); setFloor(1); setIsDead(false); setInventory([]); setCombo(0);
      };

      const selectPower = (pu) => {
        const newPowers = [...activePowers];
        const exists = newPowers.find(i => i.id === pu.id);
        if (exists) exists.lvl = Math.min(5, exists.lvl + 1); else newPowers.push({ id: pu.id, lvl: 1 });
        setActivePowers(newPowers);
        let updatedP = { ...p };
        if (pu.id === 'atk_dmg') updatedP.atk += 2;
        if (pu.id === 'atk_rng') updatedP.range += 1;
        setP(updatedP); setOffered([]);
      };

      const move = (dx, dy) => {
        if (!p || isDead || p.sp > 0 || offered.length > 0) return;
        const nx = p.x + dx, ny = p.y + dy;
        const nf = dx > 0 ? 'RIGHT' : dx < 0 ? 'LEFT' : dy > 0 ? 'DOWN' : 'UP';
        let hitEnemies = [];

        if (charClass.id === 'war') {
          let tx = p.x + dx, ty = p.y + dy;
          let targets = [{x: tx, y: ty}];
          if (dx !== 0) { targets.push({x: tx, y: ty-1}, {x: tx, y: ty+1}); } else { targets.push({x: tx-1, y: ty}, {x: tx+1, y: ty}); }
          targets.forEach(t => { if (map[t.y]?.[t.x]?.e && map[t.y][t.x].e.type !== 'fruit') hitEnemies.push({x: t.x, y: t.y, e: map[t.y][t.x].e}); });
        } 
        else if (charClass.id === 'arc') {
          for (let r = 1; r <= p.range; r++) {
            let tx = p.x + (dx * r), ty = p.y + (dy * r);
            if (map[ty]?.[tx]?.t === 'wall') break;
            if (map[ty]?.[tx]?.e && map[ty][tx].e.type !== 'fruit') hitEnemies.push({x: tx, y: ty, e: map[ty][tx].e});
          }
        } 
        else {
          for (let r = 1; r <= p.range; r++) {
            let tx = p.x + (dx * r), ty = p.y + (dy * r);
            if (map[ty]?.[tx]?.e && map[ty][tx].e.type !== 'fruit') { hitEnemies.push({x: tx, y: ty, e: map[ty][tx].e}); break; }
            if (map[ty]?.[tx]?.t === 'wall') break;
          }
        }

        if (hitEnemies.length > 0) {
          const isCrit = combo >= 3; const finalDmg = isCrit ? p.atk * 2 : p.atk;
          if (isCrit) setShakeKey(k => k + 1);
          let totalXpGained = 0, killedAny = false, numKills = 0;
          
          hitEnemies.forEach(t => {
            t.e.hp -= finalDmg;
            if (t.e.hp <= 0) { map[t.y][t.x].b = true; totalXpGained += t.e.xp; map[t.y][t.x].e = null; killedAny = true; numKills++; }
          });
          
          const leach = activePowers.find(i => i.id === 'atk_lch');
          if (leach) p.hp = Math.min(p.max, p.hp + (leach.lvl * numKills));
          
          if (killedAny) {
            const newMeta = { ...meta, totalKills: meta.totalKills + numKills };
            setMeta(newMeta); localStorage.setItem('bw_meta_pixel_v6', JSON.stringify(newMeta));
            let nXp = p.xp + totalXpGained;
            if (nXp >= p.lvl * 40) { 
               nXp -= (p.lvl * 40); setFlashKey(k => k + 1); const nLvl = p.lvl + 1;
               if (nLvl > meta.maxLevel) setMeta(m => { const nm = {...m, maxLevel: nLvl}; localStorage.setItem('bw_meta_pixel_v6', JSON.stringify(nm)); return nm;});
               setP(v => ({...v, xp: nXp, lvl: nLvl, sp: v.sp + 1, f: nf}));
            } else setP(v => ({...v, xp: nXp, f: nf}));
            setCombo(c => c + 1);
          } else setP(v => ({...v, f: nf}));
          processAI(p.x, p.y); return;
        }
        
        const cell = map[ny]?.[nx];
        if (!cell || cell.t === 'wall') { setP(v => ({...v, f: nf})); return; }
        if (cell.t === 'stairs') {
          const nF = floor + 1; setFloor(nF);
          if (nF > meta.maxFloor) setMeta(m => { const nm = {...m, maxFloor: nF}; localStorage.setItem('bw_meta_pixel_v6', JSON.stringify(nm)); return nm;});
          const regen = activePowers.find(i => i.id === 'hp_reg');
          let healedHp = p.hp;
          if (regen) healedHp = Math.min(p.max, p.hp + Math.floor(p.max * (0.05 * regen.lvl)));
          
          const tempP = {...p, x: 2, y: 2, f: 'DOWN', hp: healedHp};
          setMap(generateLevel(nF, tempP)); setP(tempP);
          setOffered([...POWER_CATALOG].sort(() => 0.5 - Math.random()).slice(0, 3));
          return;
        }
        
        let newInv = [...inventory], newHp = p.hp;
        if (cell.e?.type === 'fruit') { if (newInv.length < 3) newInv.push('apple'); else newHp = Math.min(p.max, p.hp + 15); cell.e = null; }
        
        const newP = {...p, x: nx, y: ny, f: nf, hp: newHp};
        setP(newP); setInventory(newInv); processAI(nx, ny, newP);
      };

      const processAI = (px, py, latestP = p) => {
        let dmg = 0;
        const resPower = activePowers.find(i => i.id === 'def_res')?.lvl || 0;
        const rflPower = activePowers.find(i => i.id === 'def_rfl')?.lvl || 0;
        
        const newMap = map.map(row => row.map(c => {
          let updatedC = { ...c };
          if (calcVis(c.x, c.y, latestP)) updatedC.v = true;

          if (updatedC.e && updatedC.e.type !== 'fruit') {
            const dx = Math.abs(px - updatedC.x), dy = Math.abs(py - updatedC.y);
            if (dx <= 1 && dy <= 1) { 
              let hit = Math.max(1, updatedC.e.dmg - (latestP.def + resPower));
              if(isNaN(hit)) hit = 1; dmg += hit; 
              if (rflPower > 0) { 
                updatedC.e.hp -= Math.floor(hit * (0.2 * rflPower)); 
                if (updatedC.e.hp <= 0) return { ...updatedC, e: null, b: true }; 
              }
              return updatedC; 
            }
            else if (Math.random() > 0.5) {
              const sx = updatedC.x + (px > updatedC.x ? 1 : px < updatedC.x ? -1 : 0), sy = updatedC.y + (py > updatedC.y ? 1 : py < updatedC.y ? -1 : 0);
              if (map[sy]?.[sx]?.t === 'floor' && !map[sy][sx].e && !(sx === px && sy === py)) return { ...updatedC, e: null, next: { ...updatedC.e, nx: sx, ny: sy } };
            }
          }
          return updatedC;
        }));
        
        if (dmg > 0) { setCombo(0); if(dmg > 5) setShakeKey(k => k + 1); }
        newMap.forEach(r => r.forEach(c => { if(c.next) { newMap[c.next.ny][c.next.nx].e = c.next; delete c.next; } }));
        setMap(newMap); 
        
        if (latestP.hp - dmg <= 0) {
          const finalMeta = { ...meta, legacyHP: latestP.max - charClass.stats.max, legacyATK: latestP.atk - charClass.stats.atk, legacyPowers: activePowers };
          setMeta(finalMeta); localStorage.setItem('bw_meta_pixel_v6', JSON.stringify(finalMeta));
          setIsDead(true);
        }
        setP(v => ({ ...v, hp: v.hp - dmg }));
      };

      useEffect(() => {
        const handleK = (e) => {
          if (e.key.toLowerCase() === 'h' && p && inventory.length > 0) {
            setInventory(v => v.slice(1)); setP(v => ({...v, hp: Math.min(v.max, v.hp + 25)}));
          }
          const k = {w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
          if (k[e.key]) move(...k[e.key]);
        };
        window.addEventListener('keydown', handleK);
        return () => window.removeEventListener('keydown', handleK);
      }, [p, map, inventory, isDead, combo, offered]);

      const renderPixelEntity = (type) => {
        if(type === 'war') return <div className="spr spr-war"></div>;
        if(type === 'arc') return <div className="spr spr-arc"></div>;
        if(type === 'exp') return <div className="spr spr-exp"></div>;
        if(type === 'goblin') return <div className="spr spr-goblin"></div>;
        if(type === 'slime') return <div className="spr spr-slime"></div>;
        if(type === 'bat') return <div className="spr spr-bat"></div>;
        if(type === 'boss') return <div className="spr spr-boss"></div>;
        if(type === 'fruit') return <div className="spr spr-fruit"></div>;
        if(type === 'blood') return <div className="spr spr-blood"></div>;
        return null;
      };

      const renderTileContent = (c, x, y, vis) => {
        if (p.x === x && p.y === y) return renderPixelEntity(charClass.id);
        if (c.e) return renderPixelEntity(c.e.type);
        if (c.b) return renderPixelEntity('blood');
        if (c.t === 'stairs') return <div className="stairs-door"></div>;
        return null;
      };

      // TELA INICIAL
      if (!charClass || !p) return (
        <div id="scale-wrapper" style={{transform: `scale(${scale})`}} className="flex flex-col items-center justify-center p-6 w-[1400px] h-[700px]">
          <h1 className="text-7xl font-black text-[#fbbf24] mb-8 uppercase tracking-tighter drop-shadow-[0_4px_0_#b45309]">LOST IN BLACKWOOD</h1>
          
          <div className="mb-8 p-6 wood-panel w-full max-w-xl">
            <h2 className="text-lg uppercase tracking-widest text-[#fcd34d] font-bold mb-4 text-center">Memória da Linhagem</h2>
            <div className="flex justify-around items-center">
              <div className="text-center"><p className="text-red-500 font-black text-4xl">+{meta.legacyHP || 0}</p><p className="text-xs uppercase opacity-70">HP Herdados</p></div>
              <div className="w-1 h-12 bg-[#1c100a]"></div>
              <div className="text-center"><p className="text-orange-500 font-black text-4xl">+{meta.legacyATK || 0}</p><p className="text-xs uppercase opacity-70">ATK Herdado</p></div>
            </div>
            {meta.legacyPowers?.length > 0 && <div className="mt-6 border-t-4 border-[#1c100a] pt-4 text-center"><div className="flex flex-wrap justify-center gap-2">
              {meta.legacyPowers.map(pow => {
                const pData = POWER_CATALOG.find(x=>x.id===pow.id);
                return pData ? <span key={pow.id} className={`lvl-border text-sm bg-black/60 lvl-${pow.lvl}`}>{pData.icon} N{pow.lvl}</span> : null;
              })}
            </div></div>}
          </div>

          <div className="flex gap-6 mb-10">
            {['CLASSES', 'CONQUISTAS'].map(n => <button key={n} onClick={() => setShowMilestones(n === 'CONQUISTAS')} className={`px-10 py-3 text-xl font-bold uppercase transition border-b-4 hover:brightness-110 active:border-b-0 active:translate-y-1 ${((n === 'CONQUISTAS') === showMilestones) ? (n === 'CONQUISTAS' ? 'bg-[#ca8a04] border-[#854d0e]' : 'bg-[#dc2626] border-[#991b1b]') : 'bg-slate-800 border-slate-900'}`}>{n}</button>)}
          </div>

          {!showMilestones ? (
            <div className="flex flex-wrap justify-center gap-6 w-full max-w-6xl">
              {CLASSES.map(c => (
                <button key={c.id} onClick={() => start(c)} className="stone-panel p-8 hover:brightness-125 transition-all group w-[320px] text-center flex flex-col items-center">
                  <div className="mb-6 transform scale-[2.5] group-hover:scale-[3] transition-transform h-[60px] flex items-center">{renderPixelEntity(c.id)}</div>
                  <h3 className="text-3xl font-bold uppercase mb-2 text-white">{c.name}</h3>
                  <p className="text-sm text-slate-300 mb-6">{c.desc}</p>
                  <p className="text-sm text-yellow-500 font-bold tracking-widest uppercase">Iniciar Jornada</p>
                </button>
              ))}
            </div>
          ) : (
            <div className="flex flex-wrap justify-center gap-6 w-full max-w-6xl">
              {[{n:'Exterminador',t:50,v:meta.totalKills,d:'+2 ATK',i:'💀'},{n:'Explorador',t:15,v:meta.maxFloor,d:'+1 Visão',i:'👁️'},{n:'Veterano',t:10,v:meta.maxLevel,d:'+20 HP',i:'🩸'}].map((m,i)=>(
                <div key={i} className={`p-8 w-[280px] stone-panel ${m.v>=m.t?'unlocked':'opacity-50'}`}>
                  <div className="text-5xl mb-4">{m.i}</div>
                  <p className="text-2xl font-black uppercase mb-1 text-white">{m.n}</p>
                  <p className="text-lg text-yellow-500 mb-6">{m.d}</p>
                  <div className="w-full bg-[#111] h-6 border-4 border-[#1c100a] overflow-hidden"><div className="bg-yellow-500 h-full" style={{width:`${Math.min(100,(m.v/m.t)*100)}%`}}></div></div>
                  <p className="text-base mt-2 font-bold text-yellow-500">{m.v} / {m.t}</p>
                </div>
              ))}
            </div>
          )}
        </div>
      );

      // TELA DE JOGO
      return (
        <>
          {flashKey > 0 && <div key={`flash-${flashKey}`} className="pointer-events-none fixed inset-0 z-[999] flash-lvl"></div>}
          <div id="scale-wrapper" style={{transform: `scale(${scale})`}} className="w-[1400px] h-[700px] flex items-center justify-center relative">
            <div key={`shake-${shakeKey}`} className={`flex gap-10 items-start ${shakeKey > 0 ? 'shake-fx' : ''}`}>
              
              <div className="map-container relative">
                {map.map((row, y) => (
                  <div key={y} className="flex">
                    {row.map((c, x) => {
                      const vis = calcVis(x, y, p); 
                      if (!vis && !c.v) return <div key={x} className="tile bg-[#111] border border-[#111]"></div>
                      
                      const isWall = c.t === 'wall';
                      const isStairs = c.t === 'stairs';
                      let tileClass = isWall ? 'tile-tree' : (isStairs ? 'tile-stairs' : 'tile-grass');
                      
                      return (
                        <div key={x} className={`tile ${tileClass}`}>
                          {renderTileContent(c, x, y, vis)}
                          {c.e && vis && c.e.hp < c.e.maxHp && !isNaN(c.e.hp) && (
                            <div className="absolute -top-2 left-1 right-1 border-2 border-[#111] p-[2px] bg-[#333] z-20"><div className="h-1.5 bg-red-500" style={{width:`${Math.max(0, (c.e.hp/c.e.maxHp)*100)}%`}}></div></div>
                          )}
                          {!vis && c.v && <div className="fog-overlay"></div>}
                        </div>
                      );
                    })}
                  </div>
                ))}
              </div>

              <div className="w-[360px] flex flex-col gap-6">
                <div className="wood-panel p-6">
                  <div className="flex justify-between text-red-400 uppercase font-black text-sm mb-2"><span>Vida</span><span>{Math.max(0, p.hp)}/{p.max}</span></div>
                  <div className="w-full bg-[#111] h-6 border-4 border-[#1c100a] mb-8"><div className="hp-bar-solid h-full" style={{width:`${Math.min(100, Math.max(0,(p.hp/p.max)*100))}%`}}></div></div>
                  
                  <div className="hud-box p-4 text-center mb-8">
                     <p className="text-yellow-500 text-sm uppercase font-black tracking-widest mb-3">Mochila {inventory.length}/3 | Combo {combo}/3</p>
                     <div className="flex justify-center gap-4 h-8 items-center mb-3">
                      {inventory.map((_,i)=><div key={i} className="spr-fruit"></div>)}
                      {inventory.length===0 && <span className="opacity-30 text-lg uppercase font-bold">Vazia</span>}
                     </div>
                     <p className="text-white text-xs animate-pulse font-bold mt-2">[H] USAR MAÇÃ</p>
                  </div>

                  <div className="flex justify-between text-blue-400 uppercase font-black text-sm mb-2"><span>Legado Nv {p.lvl}</span><span>{Math.floor(p.xp)}/{(p.lvl*40)}</span></div>
                  <div className="w-full bg-[#111] h-6 border-4 border-[#1c100a] mb-6"><div className="xp-bar-solid h-full" style={{width:`${Math.min(100, Math.max(0,(p.xp/(p.lvl*40))*100))}%`}}></div></div>
                  
                  {activePowers.length > 0 && <div className="flex flex-wrap gap-2 justify-center border-t-4 border-[#1c100a] pt-6">
                      {activePowers.map(i => {
                        const pData = POWER_CATALOG.find(d=>d.id===i.id);
                        return pData ? <div key={i.id} className={`lvl-border bg-[#111] text-sm font-bold lvl-${i.lvl}`}>{pData.icon} N{i.lvl}</div> : null;
                      })}
                    </div>}
                </div>

                <div className="stone-panel p-6 flex flex-col items-center">
                  <div className="grid gap-[1px] bg-[#111] p-2 border-4 border-[#1c100a]" style={{gridTemplateColumns: `repeat(${MAP_W}, 1fr)`}}>
                    {map.map((row, y) => row.map((c, x) => {
                      let col = "bg-transparent";
                      if (c.v) {
                        if (p.x===x && p.y===y) col = "bg-green-400";
                        else if (c.e && c.e.type !== 'fruit' && calcVis(x,y,p)) col = "bg-red-500";
                        else if (c.t==='stairs') col = "bg-yellow-400";
                        else if (c.t==='wall') col = "bg-green-900";
                        else col = "bg-slate-700";
                      }
                      return <div key={`${x}-${y}`} className={`w-2 h-2 ${col}`}></div>;
                    }))}
                  </div>
                  <div className="mt-4 text-base uppercase font-bold text-yellow-500 tracking-widest text-center">Andar {floor}</div>
                </div>
              </div>
            </div>

            {offered.length > 0 && (
              <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-[150] p-6">
                <div className="wood-panel p-12 text-center max-w-4xl w-full">
                  <h2 className="text-6xl text-yellow-500 font-black mb-12 uppercase tracking-tighter">Dádiva da Floresta</h2>
                  <div className="flex gap-6 justify-center">
                    {offered.map(pu => <button key={pu.id} onClick={() => selectPower(pu)} className="flex-1 hud-box p-8 hover:brightness-125 transition-all text-center group w-[260px]">
                        <div className="text-7xl mb-4 group-hover:-translate-y-2 transition-transform">{pu.icon}</div>
                        <div className="text-2xl font-black uppercase text-white mb-2">{pu.name}</div>
                        <div className="text-lg text-slate-400">{pu.desc}</div>
                      </button>)}
                  </div>
                </div>
              </div>
            )}

            {p.sp > 0 && offered.length === 0 && (
              <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-[100] p-6">
                <div className="wood-panel p-12 text-center max-w-md w-full">
                  <h2 className="text-6xl text-red-500 font-black mb-10 uppercase tracking-tighter">Evolução</h2>
                  <button onClick={()=>{ setP(v=>({...v, max:v.max+20, hp:v.hp+20, sp:v.sp-1})); }} className="w-full mb-6 hud-box py-6 hover:brightness-125 hover:text-white font-black uppercase text-2xl transition-all text-red-500">Sangue (+20 HP)</button>
                  <button onClick={()=>{ setP(v=>({...v, atk:v.atk+4, sp:v.sp-1})); }} className="w-full hud-box py-6 hover:brightness-125 hover:text-white font-black uppercase text-2xl transition-all text-slate-300">Força (+4 ATK)</button>
                </div>
              </div>
            )}

            {isDead && (
              <div className="fixed inset-0 bg-[#0f0000] flex flex-col items-center justify-center z-[200] p-6 text-center">
                <h2 className="text-[150px] text-red-600 font-black mb-4 uppercase tracking-tighter leading-none drop-shadow-[0_10px_0_#450a0a]">MORTO</h2>
                <p className="text-red-400 mb-12 text-3xl font-bold uppercase tracking-widest">Sua força se une à terra.</p>
                <button onClick={() => window.location.reload()} className="px-16 py-6 wood-panel text-yellow-500 font-black hover:brightness-125 transition-all uppercase tracking-[0.2em] text-3xl">Reencarnar</button>
              </div>
            )}
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>

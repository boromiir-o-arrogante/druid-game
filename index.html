<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lost in Blackwood - Pixel Art Fix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
    body { 
      margin: 0; background-color: #020617; color: #f8fafc; 
      font-family: 'VT323', monospace; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
    }
    #scale-wrapper { 
      transition: transform 0.2s ease-out; transform-origin: center center; 
      image-rendering: pixelated; 
    }
    .hp-bar-solid { background-color: #dc2626; transition: width 0.4s steps(10); } 
    .xp-bar-solid { background-color: #3b82f6; transition: width 0.4s steps(10); }
    
    .shake-fx { animation: shakeAnim 0.35s steps(3) both; } 
    @keyframes shakeAnim {
      0% { transform: translate3d(0, 0, 0); }
      33% { transform: translate3d(-5px, 3px, 0); }
      66% { transform: translate3d(5px, -3px, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }

    .flash-lvl { animation: flashAnim 0.5s steps(2) forwards; display: block; }
    @keyframes flashAnim {
      0% { background-color: rgba(251, 191, 36, 0.8); }
      50% { background-color: transparent; }
      100% { background-color: transparent; }
    }

    .minimap-bg { background-color: #0f172a; border: 2px solid #fff; padding: 4px; box-shadow: inset 0 0 10px #000; }
    .milestone-card { background: rgba(15, 23, 42, 0.8); border: 4px solid #334155; }
    .unlocked { border-color: #fbbf24; background: rgba(251, 191, 36, 0.1); }
    .lvl-border { border: 2px solid #fff; padding: 1px 3px; font-weight: bold; }
    .lvl-1 { border-color: #64748b; color: #fff; } .lvl-2 { border-color: #22c55e; color: #fff; } 
    .lvl-3 { border-color: #3b82f6; color: #fff; } .lvl-4 { border-color: #a855f7; color: #fff; } .lvl-5 { border-color: #f97316; color: #fff; }
    .tile { width: 40px; height: 40px; background-size: cover; display: flex; align-items: center; justify-content: center; position: relative; font-size: 2rem; }
  </style>
</head>
<body class="select-none text-slate-200">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const TILE_ASSETS = {
      wall: { emoji: "🌲", bgColor: "#166534" },
      floor: { emoji: "·", bgColor: "#111827" },
      player: { emoji: "👦", bgColor: null },
      goblin: { emoji: "👹", bgColor: null },
      slime: { emoji: "🦠", bgColor: null },
      bat: { emoji: "🦇", bgColor: null },
      stairs: { emoji: "🪜", bgColor: "#facc15" },
      fruit: { emoji: "🍎", bgColor: null },
      blood: { emoji: "🩸", bgColor: null },
    };

    const CLASSES = [
      { id: 'exp', name: 'EXPLORADOR', icon: '👦', desc: 'Furtivo. Maior visão do jogo.', stats: { hp: 45, max: 45, atk: 5, range: 1, vis: 8, def: 0 } },
      { id: 'war', name: 'GUERREIRO', icon: '🛡️', desc: 'Espada varre 3 blocos em arco.', stats: { hp: 70, max: 70, atk: 5, range: 1, vis: 5, def: 2 } },
      { id: 'arc', name: 'ARQUEIRO', icon: '🏹', desc: 'Flecha perfura linha reta inteira.', stats: { hp: 35, max: 35, atk: 7, range: 4, vis: 6, def: 0 } }
    ];
    const MAP_W = 24; const MAP_H = 14; 
    const ENEMIES = [{ type: 'bat', hp: 12, xp: 10, dmg: 4 }, { type: 'slime', hp: 18, xp: 12, dmg: 5 }, { type: 'goblin', hp: 30, xp: 20, dmg: 8 }];
    const POWER_CATALOG = [
      { id: 'atk_dmg', name: 'FORÇA', icon: '⚔️', desc: '+2 Dano' },
      { id: 'atk_rng', name: 'ALCANCE', icon: '🏹', desc: '+1 Alcance' },
      { id: 'atk_lch', name: 'DRENAR', icon: '🩸', desc: 'Cura no Atq' },
      { id: 'def_res', name: 'COURAÇA', icon: '🛡️', desc: '-1 Dano Rec.' },
      { id: 'def_rfl', name: 'ESPINHOS', icon: '✨', desc: 'Reflete Dano' },
      { id: 'hp_reg', name: 'REGEN', icon: '❤️', desc: 'Cura / Andar' }
    ];

    const generateLevel = (f) => {
      let m = [];
      for (let y = 0; y < MAP_H; y++) {
        let row = [];
        for (let x = 0; x < MAP_W; x++) {
          const isBorder = x === 0 || y === 0 || x === MAP_W - 1 || y === MAP_H - 1;
          const isWall = isBorder || (Math.random() < 0.16 && x > 4 && !(y===2 && x < 15));
          row.push({ x, y, t: isWall ? 'wall' : 'floor', e: null, v: false, b: false });
        }
        m.push(row);
      }
      m[11][21].t = 'stairs';
      m.forEach(r => r.forEach(c => { if(c.t === 'floor' && Math.random() < 0.04 && c.x > 5) c.e = { type: 'fruit' }; }));
      for (let i = 0; i < 6 + (f * 2); i++) {
        let rx = Math.floor(Math.random() * (MAP_W-4)) + 3, ry = Math.floor(Math.random() * (MAP_H-4)) + 2;
        if (m[ry][rx].t === 'floor' && !m[ry][rx].e) {
          const b = ENEMIES[Math.floor(Math.random() * ENEMIES.length)];
          m[ry][rx].e = { type: b.type, hp: b.hp + (f*5), maxHp: b.hp + (f*5), dmg: b.d + Math.floor(f*1.5), xp: 10 + (f*2) };
        }
      }
      return m;
    };

    function App() {
      const [charClass, setCharClass] = useState(null);
      const [p, setP] = useState(null);
      const [floor, setFloor] = useState(1);
      const [map, setMap] = useState([]);
      const [inventory, setInventory] = useState([]);
      const [activePowers, setActivePowers] = useState([]);
      const [isDead, setIsDead] = useState(false);
      const [combo, setCombo] = useState(0);
      const [shakeKey, setShakeKey] = useState(0);
      const [flashKey, setFlashKey] = useState(0);
      const [offered, setOffered] = useState([]);
      const [showMilestones, setShowMilestones] = useState(false);
      const [scale, setScale] = useState(1);
      const [meta, setMeta] = useState(() => {
        const saved = localStorage.getItem('bw_meta_pixel_v2');
        return saved ? JSON.parse(saved) : { totalKills: 0, maxFloor: 0, maxLevel: 0, legacyHP: 0, legacyATK: 0, legacyPowers: [] };
      });

      useEffect(() => {
        const handleResize = () => {
          const gameWidth = MAP_W * 40 + 380; 
          const gameHeight = MAP_H * 40 + 50;
          const sw = window.innerWidth / gameWidth;
          const sh = window.innerHeight / gameHeight;
          setScale(Math.min(sw, sh, 1.0)); 
        };
        handleResize();
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const start = (sel) => {
        const bonusHP = (meta.legacyHP || 0) + (meta.maxLevel >= 10 ? 20 : 0) + (meta.maxLevel >= 25 ? 50 : 0);
        const bonusATK = (meta.legacyATK || 0) + (meta.totalKills >= 50 ? 2 : 0) + (meta.totalKills >= 200 ? 5 : 0);
        const bonusVIS = (meta.maxFloor >= 15 ? 1 : 0) + (meta.maxFloor >= 30 ? 2 : 0);
        
        const initial = { 
          ...sel.stats, 
          max: sel.stats.max + bonusHP, hp: sel.stats.max + bonusHP,
          atk: sel.stats.atk + bonusATK, vis: sel.stats.vis + bonusVIS,
          x: 2, y: 2, xp: 0, lvl: 1, sp: 0, f: 'DOWN' 
        };
        setP(initial); setCharClass(sel); setActivePowers(meta.legacyPowers || []);
        setMap(generateLevel(1)); setFloor(1); setIsDead(false); setInventory([]); setCombo(0);
      };

      const selectPower = (pu) => {
        const newPowers = [...activePowers];
        const exists = newPowers.find(i => i.id === pu.id);
        if (exists) exists.lvl = Math.min(5, exists.lvl + 1);
        else newPowers.push({ id: pu.id, lvl: 1 });
        setActivePowers(newPowers);
        let updatedP = { ...p };
        if (pu.id === 'atk_dmg') updatedP.atk += 2;
        if (pu.id === 'atk_rng') updatedP.range += 1;
        setP(updatedP); setOffered([]);
      };

      const isVisible = (x, y) => {
        if (!p) return false;
        const dx = x - p.x, dy = y - p.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 1.5) return true;
        if (dist > p.vis) return false;
        const angle = Math.atan2(dy, dx);
        let targetAngle = p.f === 'UP' ? -Math.PI/2 : p.f === 'DOWN' ? Math.PI/2 : p.f === 'LEFT' ? Math.PI : 0;
        let diff = Math.abs(angle - targetAngle);
        if (diff > Math.PI) diff = 2*Math.PI - diff;
        return diff < 0.8;
      };

      const move = (dx, dy) => {
        if (!p || isDead || p.sp > 0 || offered.length > 0) return;
        const nx = p.x + dx, ny = p.y + dy;
        const nf = dx > 0 ? 'RIGHT' : dx < 0 ? 'LEFT' : dy > 0 ? 'DOWN' : 'UP';
        let hitEnemies = [];

        if (charClass.id === 'war') {
          let tx = p.x + dx, ty = p.y + dy;
          let targets = [{x: tx, y: ty}];
          if (dx !== 0) { targets.push({x: tx, y: ty-1}, {x: tx, y: ty+1}); }
          else { targets.push({x: tx-1, y: ty}, {x: tx+1, y: ty}); }
          targets.forEach(t => { if (map[t.y]?.[t.x]?.e && map[t.y][t.x].e.type !== 'fruit') hitEnemies.push({x: t.x, y: t.y, e: map[t.y][t.x].e}); });
        } 
        else if (charClass.id === 'arc') {
          for (let r = 1; r <= p.range; r++) {
            let tx = p.x + (dx * r), ty = p.y + (dy * r);
            if (map[ty]?.[tx]?.t === 'wall') break;
            if (map[ty]?.[tx]?.e && map[ty][tx].e.type !== 'fruit') hitEnemies.push({x: tx, y: ty, e: map[ty][tx].e});
          }
        } 
        else {
          for (let r = 1; r <= p.range; r++) {
            let tx = p.x + (dx * r), ty = p.y + (dy * r);
            if (map[ty]?.[tx]?.e && map[ty][tx].e.type !== 'fruit') { hitEnemies.push({x: tx, y: ty, e: map[ty][tx].e}); break; }
            if (map[ty]?.[tx]?.t === 'wall') break;
          }
        }

        if (hitEnemies.length > 0) {
          const isCrit = combo >= 3;
          const finalDmg = isCrit ? p.atk * 2 : p.atk;
          if (isCrit) setShakeKey(k => k + 1);
          let totalXpGained = 0, killedAny = false, numKills = 0;
          
          hitEnemies.forEach(t => {
            t.e.hp -= finalDmg;
            if (t.e.hp <= 0) {
              map[t.y][t.x].b = true; totalXpGained += t.e.xp; map[t.y][t.x].e = null; killedAny = true; numKills++;
            }
          });
          
          const leach = activePowers.find(i => i.id === 'atk_lch');
          if (leach) p.hp = Math.min(p.max, p.hp + (leach.lvl * numKills));
          
          if (killedAny) {
            const newMeta = { ...meta, totalKills: meta.totalKills + numKills };
            setMeta(newMeta); localStorage.setItem('bw_meta_pixel_v2', JSON.stringify(newMeta));
            let nXp = p.xp + totalXpGained;
            if (nXp >= p.lvl * 40) { 
               nXp -= (p.lvl * 40); setFlashKey(k => k + 1); const nLvl = p.lvl + 1;
               if (nLvl > meta.maxLevel) setMeta(m => { const nm = {...m, maxLevel: nLvl}; localStorage.setItem('bw_meta_pixel_v2', JSON.stringify(nm)); return nm;});
               setP(v => ({...v, xp: nXp, lvl: nLvl, sp: v.sp + 1, f: nf}));
            } else setP(v => ({...v, xp: nXp, f: nf}));
            setCombo(c => c + 1);
          } else setP(v => ({...v, f: nf}));
          processAI(p.x, p.y); return;
        }
        
        const cell = map[ny]?.[nx];
        if (!cell || cell.t === 'wall') { setP(v => ({...v, f: nf})); return; }
        if (cell.t === 'stairs') {
          const nF = floor + 1; setFloor(nF);
          if (nF > meta.maxFloor) setMeta(m => { const nm = {...m, maxFloor: nF}; localStorage.setItem('bw_meta_pixel_v2', JSON.stringify(nm)); return nm;});
          const regen = activePowers.find(i => i.id === 'hp_reg');
          let healedHp = p.hp;
          if (regen) healedHp = Math.min(p.max, p.hp + Math.floor(p.max * (0.05 * regen.lvl)));
          setMap(generateLevel(nF)); setP(v => ({...v, x: 2, y: 2, f: 'DOWN', hp: healedHp}));
          setOffered([...POWER_CATALOG].sort(() => 0.5 - Math.random()).slice(0, 3));
          return;
        }
        
        let newInv = [...inventory], newHp = p.hp;
        if (cell.e?.type === 'fruit') {
          if (newInv.length < 3) newInv.push('apple'); else newHp = Math.min(p.max, p.hp + 15);
          cell.e = null;
        }
        setP(v => ({...v, x: nx, y: ny, f: nf, hp: newHp})); setInventory(newInv);
        processAI(nx, ny);
      };

      const processAI = (px, py) => {
        let dmg = 0;
        const resPower = activePowers.find(i => i.id === 'def_res')?.lvl || 0;
        const rflPower = activePowers.find(i => i.id === 'def_rfl')?.lvl || 0;
        const newMap = map.map(row => row.map(c => {
          if (c.e && c.e.type !== 'fruit') {
            const dx = Math.abs(px - c.x), dy = Math.abs(py - c.y);
            if (dx <= 1 && dy <= 1) { 
              let hit = Math.max(1, c.e.dmg - (p.def + resPower));
              dmg += hit; 
              if (rflPower > 0) { c.e.hp -= Math.floor(hit * (0.2 * rflPower)); if (c.e.hp <= 0) return { ...c, e: null, b: true }; }
              return c; 
            }
            else if (Math.random() > 0.5) {
              const sx = c.x + (px > c.x ? 1 : px < c.x ? -1 : 0), sy = c.y + (py > c.y ? 1 : py < c.y ? -1 : 0);
              if (map[sy]?.[sx]?.t === 'floor' && !map[sy][sx].e) return { ...c, e: null, next: { ...c.e, nx: sx, ny: sy } };
            }
          }
          return c;
        }));
        
        if (dmg > 0) { setCombo(0); if(dmg > 5) setShakeKey(k => k + 1); }
        newMap.forEach(r => r.forEach(c => { if(c.next) { newMap[c.next.ny][c.next.nx].e = c.next; delete c.next; } }));
        setMap(newMap); 
        
        if (p.hp - dmg <= 0) {
          const finalMeta = { ...meta, legacyHP: p.max - charClass.stats.max, legacyATK: p.atk - charClass.stats.atk, legacyPowers: activePowers };
          setMeta(finalMeta); localStorage.setItem('bw_meta_pixel_v2', JSON.stringify(finalMeta));
          setIsDead(true);
        }
        setP(v => ({ ...v, hp: v.hp - dmg }));
      };

      useEffect(() => {
        const handleK = (e) => {
          if (e.key.toLowerCase() === 'h' && p && inventory.length > 0) {
            setInventory(v => v.slice(1)); setP(v => ({...v, hp: Math.min(v.max, v.hp + 25)}));
          }
          const k = {w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
          if (k[e.key]) move(...k[e.key]);
        };
        window.addEventListener('keydown', handleK);
        return () => window.removeEventListener('keydown', handleK);
      }, [p, map, inventory, isDead, combo, offered]);

      const renderTile = (type, eType, isPlayer, isBlood, hasDmg) => {
        const char = isPlayer ? charClass.icon : (eType ? EMOJIS[eType] : (isBlood ? EMOJIS.blood : EMOJIS[type]));
        const config = TILE_ASSETS[isPlayer ? 'player' : (eType || (isBlood ? 'blood' : type))];
        const style = { backgroundColor: config.bgColor, opacity: hasDmg ? 0.7 : 1, filter: isBlood ? 'brightness(0.7)' : 'none' };
        return <div className="tile" style={style}>{char}</div>;
      }

      if (!charClass) return (
        <div id="scale-wrapper" style={{transform: `scale(${scale})`}} className="flex flex-col items-center justify-center p-6 w-[1150px] h-[850px]">
          <h1 className="text-7xl font-black text-red-600 mb-8 italic uppercase tracking-tighter">Lost in Blackwood</h1>
          <div className="mb-8 p-5 bg-slate-900 border-2 border-slate-700 w-full max-w-lg shadow-2xl">
            <h2 className="text-xl font-bold uppercase text-slate-400 mb-4 text-center">Memória da Linhagem</h2>
            <div className="flex justify-around items-center">
              <div className="text-center"><p className="text-red-500 font-black text-3xl">+{meta.legacyHP || 0} HP</p><p className="text-xs uppercase opacity-70">Resistência Extra</p></div>
              <div className="w-px h-10 bg-slate-700"></div>
              <div className="text-center"><p className="text-orange-500 font-black text-3xl">+{meta.legacyATK || 0} ATK</p><p className="text-xs uppercase opacity-70">Força Extra</p></div>
            </div>
            {meta.legacyPowers?.length > 0 && <div className="mt-4 border-t-2 border-slate-700 pt-4 text-center"><div className="flex flex-wrap justify-center gap-2">{meta.legacyPowers.map(pow => <span key={pow.id} className={`lvl-border border text-[11px] font-bold bg-black/40 lvl-${pow.lvl}`}>{POWER_CATALOG.find(x=>x.id===pow.id)?.icon} N{pow.lvl}</span>)}</div></div>}
          </div>
          <div className="flex gap-6 mb-10">
            {['CLASSES', 'CONQUISTAS'].map(n => <button key={n} onClick={() => setShowMilestones(n === 'CONQUISTAS')} className={`px-10 py-3 text-lg font-bold uppercase transition ${((n === 'CONQUISTAS') === showMilestones) ? (n === 'CONQUISTAS' ? 'bg-yellow-600' : 'bg-red-600') : 'bg-slate-900'}`}>{n}</button>)}
          </div>
          {!showMilestones ? (
            <div className="flex flex-wrap justify-center gap-6 w-full max-w-5xl">
              {CLASSES.map(c => (
                <button key={c.id} onClick={() => start(c)} className="bg-slate-900 border-4 border-slate-700 p-8 hover:border-red-600 transition-all group w-[300px] text-center">
                  <div className="text-7xl mb-6 group-hover:scale-110 transition-transform">{c.icon}</div>
                  <h3 className="text-3xl font-bold uppercase mb-1">{c.name}</h3>
                  <p className="text-[11px] text-slate-400 mb-6 italic">{c.desc}</p>
                  <p className="text-[11px] text-red-500 font-bold tracking-widest uppercase">Iniciar</p>
                </button>
              ))}
            </div>
          ) : (
            <div className="flex flex-wrap justify-center gap-6 w-full max-w-5xl">
              {[{n:'Exterminador',t:50,v:meta.totalKills,d:'+2 ATK',i:'💀'},{n:'Explorador',t:15,v:meta.maxFloor,d:'+1 Visão',i:'👁️'},{n:'Veterano',t:10,v:meta.maxLevel,d:'+20 HP',i:'🩸'}].map((m,i)=>(
                <div key={i} className={`p-8 w-[280px] milestone-card ${m.v>=m.t?'unlocked':'opacity-30'}`}>
                  <div className="text-5xl mb-4">{m.i}</div>
                  <p className="text-2xl font-black uppercase mb-1">{m.n}</p>
                  <p className="text-sm text-slate-300 mb-6">{m.d}</p>
                  <div className="w-full bg-black h-4 border-2 border-slate-700 overflow-hidden"><div className="bg-yellow-500 h-full" style={{width:`${Math.min(100,(m.v/m.t)*100)}%`}}></div></div>
                  <p className="text-sm mt-3 font-bold text-yellow-600">{m.v} / {m.t}</p>
                </div>
              ))}
            </div>
          )}
        </div>
      );

      return (
        <>
          {flashKey > 0 && <div key={`flash-${flashKey}`} className="pointer-events-none fixed inset-0 z-[999] flash-lvl"></div>}
          <div id="scale-wrapper" style={{transform: `scale(${scale})`}} className="w-[1150px] h-[850px] flex items-center justify-center relative">
            <div key={`shake-${shakeKey}`} className={`flex gap-10 items-start ${shakeKey > 0 ? 'shake-fx' : ''}`}>
              
              <div className="bg-black border-[6px] border-slate-800 shadow-[0_0_50px_#000] overflow-hidden relative">
                {map.map((row, y) => (
                  <div key={y} className="flex">
                    {row.map((c, x) => {
                      const vis = isVisible(x, y); if (vis) c.v = true;
                      if (!vis && !c.v) return <div key={x} className="tile black-cell" style={{backgroundColor: '#000'}}>⬛</div>
                      
                      const ch = renderTile(c.t, c.e?.type, p.x===x && p.y===y, c.b, vis && !c.b && c.t==='floor' && !c.e);
                      
                      return (
                        <div key={x} className="relative" style={{opacity: vis ? 1 : 0.1, filter: vis ? 'none' : 'grayscale(1)'}}>
                          {ch}
                          {c.e && vis && c.e.hp < c.e.maxHp && (
                            <div className="absolute -top-1 left-1 right-1 enemy-hp-container"><div className="h-1 bg-red-600" style={{width:`${Math.max(0, (c.e.hp/c.e.maxHp)*100)}%`}}></div></div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                ))}
              </div>

              <div className="w-[340px] flex flex-col gap-6">
                <div className="bg-slate-900 p-8 border-4 border-slate-700 shadow-2xl">
                  <div className="flex justify-between text-red-500 uppercase font-black text-xs mb-3"><span>Integridade</span><span>{Math.max(0, p.hp)}/{p.max}</span></div>
                  <div className="w-full bg-black h-5 border-2 border-slate-800 mb-8"><div className="hp-bar-solid h-full" style={{width:`${Math.max(0,(p.hp/p.max)*100)}%`}}></div></div>
                  
                  <div className="bg-black/60 p-5 border-2 border-slate-700 text-center mb-8 shadow-inner">
                     <p className="text-emerald-400 text-xs uppercase font-black tracking-widest mb-3">Mochila {inventory.length}/3 | Combo {combo}/3</p>
                     <div className="flex justify-center gap-3 text-4xl mb-3">
                      {inventory.map((_,i)=><span key={i}>🍎</span>)}
                      {inventory.length===0 && <span className="opacity-10 text-xl uppercase font-bold text-slate-700">Vazia</span>}
                     </div>
                     <p className="text-white text-xs animate-pulse font-bold mt-2">[H] CURAR</p>
                  </div>

                  <div className="flex justify-between text-blue-400 uppercase font-black text-xs mb-2"><span>Legado Nv {p.lvl}</span><span>{Math.floor(p.xp)}/{(p.lvl*40)}</span></div>
                  <div className="w-full bg-black h-4 border-2 border-slate-800 mb-6"><div className="xp-bar-solid h-full" style={{width:`${(p.xp/(p.lvl*40))*100}%`}}></div></div>
                  
                  {activePowers.length > 0 && <div className="flex flex-wrap gap-2 justify-center border-t-2 border-slate-800 pt-6">
                       {activePowers.map(i => <div key={i.id} className={`lvl-border border text-[11px] font-bold bg-black/40 lvl-${i.lvl}`}>{POWER_CATALOG.find(d=>d.id===i.id).icon} N{i.lvl}</div>)}
                    </div>}
                </div>

                <div className="minimap-bg p-6 flex flex-col items-center">
                  <div className="grid gap-[1px]" style={{gridTemplateColumns: `repeat(${MAP_W}, 1fr)`}}>
                    {map.map((row, y) => row.map((c, x) => {
                      let col = "bg-transparent";
                      if (c.v) {
                        if (p.x===x && p.y===y) col = "bg-emerald-400";
                        else if (c.e && c.e.type !== 'fruit' && isVisible(x,y)) col = "bg-red-600";
                        else if (c.t==='stairs') col = "bg-yellow-400";
                        else if (c.t==='wall') col = "bg-slate-700";
                        else col = "bg-slate-900";
                      }
                      return <div key={`${x}-${y}`} className={`w-1.5 h-1.5 rounded-[1px] ${col}`}></div>;
                    }))}
                  </div>
                  <div className="mt-4 text-[12px] uppercase font-bold text-slate-500 tracking-widest italic text-center">Andar {floor} | Kill Count {meta.totalKills}</div>
                </div>
              </div>
            </div>

            {offered.length > 0 && (
              <div className="fixed inset-0 bg-black/98 flex items-center justify-center z-[150] p-6">
                <div className="bg-slate-900 border-4 border-emerald-600 p-12 text-center max-w-3xl w-full shadow-[0_0_100px_rgba(5,150,105,0.3)]">
                  <h2 className="text-5xl text-emerald-500 font-black mb-12 uppercase italic tracking-tighter">Dádiva da Floresta</h2>
                  <div className="flex gap-6 justify-center">
                    {offered.map(pu => <button key={pu.id} onClick={() => selectPower(pu)} className="flex-1 bg-black border-4 border-slate-700 p-8 hover:border-emerald-500 transition-all text-center group w-[220px]">
                        <div className="text-6xl mb-4 group-hover:scale-110 transition-transform">{pu.icon}</div>
                        <div className="text-2xl font-black uppercase text-white mb-1">{pu.name}</div>
                        <div className="text-xs text-slate-400">{pu.desc}</div>
                      </button>)}
                  </div>
                </div>
              </div>
            )}

            {p.sp > 0 && offered.length === 0 && (
              <div className="fixed inset-0 bg-black/95 flex items-center justify-center z-[100] p-6">
                <div className="bg-slate-900 border-4 border-red-600 p-12 text-center max-w-md w-full shadow-[0_0_100px_rgba(220,38,38,0.3)]">
                  <h2 className="text-5xl text-red-500 font-black mb-10 uppercase italic tracking-tighter">Evolução</h2>
                  <button onClick={()=>{ setP(v=>({...v, max:v.max+20, hp:v.hp+20, sp:v.sp-1})); }} className="w-full mb-6 bg-slate-900 border-4 border-red-600 text-red-500 py-6 hover:bg-red-600 hover:text-white font-black uppercase text-lg transition-all shadow-lg">Sangue (+20 HP)</button>
                  <button onClick={()=>{ setP(v=>({...v, atk:v.atk+4, sp:v.sp-1})); }} className="w-full bg-slate-800 border-4 border-slate-700 text-slate-300 py-6 hover:bg-slate-200 hover:text-black font-black uppercase text-lg transition-all shadow-lg">Força (+4 ATK)</button>
                </div>
              </div>
            )}

            {isDead && (
              <div className="fixed inset-0 bg-black/98 flex flex-col items-center justify-center z-[200] p-6 text-center">
                <h2 className="text-[120px] text-red-800 font-black mb-4 uppercase italic tracking-tighter leading-none">Caiu</h2>
                <p className="text-slate-500 mb-12 text-2xl font-bold uppercase tracking-widest italic">A linhagem aguarda um novo herdeiro.</p>
                <button onClick={() => window.location.reload()} className="px-20 py-8 bg-slate-900 text-white font-black hover:bg-red-700 transition-all border-4 border-red-600 shadow-[0_0_50px_rgba(220,38,38,0.4)] uppercase tracking-[0.3em] text-2xl">Assumir Herança</button>
              </div>
            )}
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost in Blackwood - Hardcore Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; background-color: #020617; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
    .map-container { box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(220, 38, 38, 0.1); }
    .panel-glow { box-shadow: 0 4px 20px rgba(0,0,0,0.6); border: 1px solid rgba(51, 65, 85, 0.5); }
    .hp-gradient { background: linear-gradient(90deg, #991b1b 0%, #dc2626 100%); box-shadow: 0 0 10px rgba(220, 38, 38, 0.4); }
    .minimap-pixel { width: 6px; height: 6px; border-radius: 1px; transition: background-color 0.3s; }
    @keyframes pulse-red { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .animate-pulse-red { animation: pulse-red 1s infinite; }
  </style>
</head>
<body class="select-none">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const EMOJIS = { 
      wall: "🌲", floor: "·", player: "👦", goblin: "👹", 
      slime: "🦠", orc: "🧌", bat: "🦇", fog: "⬛", 
      stairs: "🪜", fruit: "🍎", boss: "👿" 
    };
    
    const ENEMY_TYPES = [
      { type: 'bat', hp: 4, xp: 2, dmg: 1, name: 'Morcego' },
      { type: 'slime', hp: 7, xp: 3, dmg: 2, name: 'Slime' },
      { type: 'goblin', hp: 12, xp: 5, dmg: 3, name: 'Goblin' },
      { type: 'orc', hp: 22, xp: 10, dmg: 5, name: 'Orc' }
    ];

    const MAP_W = 24; const MAP_H = 14; const VISION = 5;

    const isVisible = (x, y, p) => {
      const dx = Math.abs(x - p.x), dy = Math.abs(y - p.y);
      if (dx <= 1 && dy <= 1) return true;
      if (dx > VISION || dy > VISION) return false;
      if (p.f === 'UP' && y < p.y && dx <= dy) return true;
      if (p.f === 'DOWN' && y > p.y && dx <= Math.abs(dy)) return true;
      if (p.f === 'LEFT' && x < p.x && dy <= dx) return true;
      if (p.f === 'RIGHT' && x > p.x && dy <= Math.abs(dx)) return true;
      return false;
    };

    const generateMap = (floor) => {
      let map = [];
      for (let y = 0; y < MAP_H; y++) {
        let row = [];
        for (let x = 0; x < MAP_W; x++) {
          const isWall = x === 0 || y === 0 || x === MAP_W - 1 || y === MAP_H - 1 || (Math.random() < 0.17 && x > 4);
          row.push({ x, y, t: isWall ? 'wall' : 'floor', e: null, v: false });
        }
        map.push(row);
      }

      // Frutas raras (2%)
      map.forEach(r => r.forEach(c => {
        if (c.t === 'floor' && Math.random() < 0.02) c.e = { type: 'fruit' };
      }));

      // Boss Garantido (70%)
      if (Math.random() < 0.7) {
        let bx = Math.floor(Math.random() * 8) + 12, by = Math.floor(Math.random() * 8) + 3;
        if(map[by][bx].t === 'floor') {
            map[by][bx].e = { type: 'boss', hp: 30 + (floor * 15), dmg: 4 + floor, xp: 25, name: 'Ancião' };
        }
      }

      // Monstros
      for (let i = 0; i < 6 + floor; i++) {
        let rx = Math.floor(Math.random() * (MAP_W-2)) + 1, ry = Math.floor(Math.random() * (MAP_H-2)) + 1;
        if (map[ry][rx].t === 'floor' && !map[ry][rx].e) {
          const base = ENEMY_TYPES[Math.floor(Math.random() * Math.min(floor, 4))];
          map[ry][rx].e = { ...base, hp: base.hp + (floor * 2), dmg: base.dmg + Math.floor(floor/2) };
        }
      }

      map[MAP_H-2][MAP_W-2].t = 'stairs';
      return map;
    };

    function App() {
      const [floor, setFloor] = useState(1);
      const [p, setP] = useState({ x: 2, y: 2, hp: 25, max: 25, atk: 5, f: 'DOWN', xp: 0, lvl: 1, sp: 0 });
      const [map, setMap] = useState(() => generateMap(1));
      const [log, setLog] = useState(["A floresta observa seus passos..."]);

      const updateAI = (currentMap, playerPos) => {
        let newMap = currentMap.map(r => r.map(c => ({...c})));
        let damageTaken = 0;
        for (let y = 0; y < MAP_H; y++) {
          for (let x = 0; x < MAP_W; x++) {
            const cell = currentMap[y][x];
            if (cell.e && !['player', 'fruit'].includes(cell.e.type)) {
              let dx = playerPos.x - x, dy = playerPos.y - y;
              if (Math.abs(dx) <= 1 && Math.abs(dy) <= 1) {
                damageTaken += cell.e.dmg || 1;
              } else if (Math.random() > 0.3) { // 70% chance de perseguir
                let stepX = x + (dx !== 0 ? dx / Math.abs(dx) : 0);
                let stepY = y + (dy !== 0 ? dy / Math.abs(dy) : 0);
                if (newMap[stepY][stepX].t === 'floor' && !newMap[stepY][stepX].e) {
                  newMap[stepY][stepX].e = {...cell.e};
                  newMap[y][x].e = null;
                }
              }
            }
          }
        }
        return { newMap, damageTaken };
      };

      const move = (dx, dy) => {
        if (p.hp <= 0 || p.sp > 0) return;
        let nx = p.x + dx, ny = p.y + dy;
        let nf = dx > 0 ? 'RIGHT' : dx < 0 ? 'LEFT' : dy > 0 ? 'DOWN' : 'UP';
        
        const target = map[ny]?.[nx];
        if (!target || target.t === 'wall') { setP(prev => ({...prev, f: nf})); return; }

        let newLog = [];
        let newP = { ...p, x: nx, y: ny, f: nf };

        if (target.e) {
          if (target.e.type === 'fruit') {
            newP.hp = Math.min(newP.hp + 6, newP.max);
            newLog.push("🍎 Fruta silvestre! (+6 HP)");
            target.e = null;
          } else {
            target.e.hp -= p.atk;
            newLog.push(`Golpe no ${target.e.name}!`);
            if (target.e.hp <= 0) {
              newP.xp += target.e.xp;
              newLog.push(`Eliminado! +${target.e.xp} XP`);
              target.e = null;
              if (newP.xp >= newP.lvl * 10) { newP.lvl++; newP.sp++; }
            }
            newP.x = p.x; newP.y = p.y;
          }
        }

        const ai = updateAI(map, {x: newP.x, y: newP.y});
        newP.hp -= ai.damageTaken;
        if (ai.damageTaken > 0) newLog.push(`💥 Emboscada! -${ai.damageTaken} HP`);

        if (target.t === 'stairs' && !target.e) {
          const nextF = floor + 1;
          setFloor(nextF);
          const m = generateMap(nextF);
          setMap(m);
          setP({...newP, x: 2, y: 2});
          setLog([`Entrando no nível ${nextF}...`, ...log]);
          return;
        }

        setLog(prev => [...newLog, ...prev].slice(0, 6));
        setMap(ai.newMap);
        setP(newP);
      };

      useEffect(() => {
        const h = (e) => {
          const k = {w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
          if (k[e.key]) { e.preventDefault(); move(...k[e.key]); }
        };
        window.addEventListener('keydown', h);
        return () => window.removeEventListener('keydown', h);
      }, [p, map]);

      return (
        <div className="flex flex-col items-center justify-center min-h-screen bg-slate-950 p-4">
          <header className="mb-6 text-center">
            <h1 className="text-red-600 text-4xl font-black italic tracking-tighter drop-shadow-[0_2px_10px_rgba(220,38,38,0.5)]">LOST IN BLACKWOOD</h1>
            <p className="text-slate-500 text-[10px] uppercase tracking-[0.5em] mt-1 font-bold">Inimigo no encalço • Nível {floor}</p>
          </header>

          <div className="flex flex-col xl:flex-row gap-8 items-start max-w-7xl">
            {/* MAPA PRINCIPAL */}
            <div className="map-container border-4 border-slate-900 bg-black p-1 rounded-2xl overflow-hidden">
              {map.map((row, y) => (
                <div key={y} className="flex">
                  {row.map((c, x) => {
                    const vis = isVisible(x, y, p);
                    if (vis) c.v = true;
                    let char = "⬛"; let op = "opacity-0";
                    if (vis) { char = p.x===x && p.y===y ? EMOJIS.player : (c.e ? EMOJIS[c.e.type] : EMOJIS[c.t]); op="opacity-100"; }
                    else if (c.v) { char = EMOJIS[c.t]; op="opacity-10 grayscale"; }
                    return <div key={x} className={`w-8 h-8 md:w-10 md:h-10 flex items-center justify-center text-xl transition-opacity duration-300 ${op}`}>{char}</div>;
                  })}
                </div>
              ))}
            </div>

            {/* PAINEL LATERAL */}
            <div className="w-full xl:w-80 flex flex-col gap-6">
              
              {/* STATUS CARD */}
              <div className="panel-glow bg-slate-900/80 backdrop-blur p-5 rounded-2xl border-t-2 border-red-600/50">
                <div className="flex justify-between items-end mb-4">
                  <div className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Sinais Vitais</div>
                  <div className="text-red-500 font-black text-xl italic">LVL {p.lvl}</div>
                </div>
                
                <div className="mb-4">
                  <div className="flex justify-between text-[11px] mb-1 font-bold">
                    <span className="text-red-400">INTEGRIDADE</span>
                    <span className="text-slate-300">{p.hp} / {p.max}</span>
                  </div>
                  <div className="w-full bg-black h-4 rounded-full border border-slate-800 p-0.5 shadow-inner">
                    <div className="hp-gradient h-full rounded-full transition-all duration-500" style={{width:`${(p.hp/p.max)*100}%`}}></div>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-black/50 p-2 rounded-xl border border-slate-800 text-center">
                    <div className="text-[9px] text-slate-500 uppercase">Ataque</div>
                    <div className="text-orange-500 font-black">⚔️ {p.atk}</div>
                  </div>
                  <div className="bg-black/50 p-2 rounded-xl border border-slate-800 text-center">
                    <div className="text-[9px] text-slate-500 uppercase">Exp.</div>
                    <div className="text-blue-400 font-black">✨ {p.xp}</div>
                  </div>
                </div>
              </div>

              {/* MINI MAPA PREMIUM */}
              <div className="panel-glow bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
                <div className="flex justify-between items-center mb-3">
                  <div className="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Radar Local</div>
                  <div className="flex items-center gap-1">
                    <div className="w-1.5 h-1.5 bg-red-600 rounded-full animate-pulse"></div>
                    <span className="text-[8px] text-red-600 font-bold uppercase">Scan Ativo</span>
                  </div>
                </div>
                <div className="bg-black/90 p-2 rounded-xl border border-red-900/20 flex justify-center">
                  <div className="grid gap-[1px]" style={{gridTemplateColumns:`repeat(${MAP_W}, 1fr)`}}>
                    {map.map((row, y) => row.map((c, x) => {
                      let color = "bg-transparent";
                      const vis = isVisible(x,y,p);
                      if (c.v) {
                        if (p.x===x && p.y===y) color = "bg-emerald-400 shadow-[0_0_8px_#34d399]";
                        else if (c.e && vis) color = c.e.type==='boss' ? "bg-purple-500 animate-pulse-red" : "bg-red-600 animate-pulse-red";
                        else if (c.t==='stairs') color = "bg-amber-400 animate-pulse";
                        else if (c.t==='wall') color = "bg-slate-800";
                        else color = "bg-slate-900";
                      }
                      return <div key={`${x}-${y}`} className={`minimap-pixel ${color}`}></div>;
                    }))}
                  </div>
                </div>
              </div>

              {/* LOG */}
              <div className="bg-black/40 border-l-4 border-red-600 p-4 rounded-r-2xl h-36 overflow-hidden shadow-inner">
                {log.map((m, i) => (
                  <div key={i} className={`text-[10px] mb-2 leading-tight ${i === 0 ? "text-red-400 font-bold italic" : "text-slate-600"}`}>
                    {i === 0 ? "» " : ""}{m}
                  </div>
                ))}
              </div>
            </div>
          </div>

          {p.hp <= 0 && (
            <div className="fixed inset-0 bg-black/95 flex flex-col items-center justify-center z-[100] p-6 animate-in fade-in duration-1000">
              <h2 className="text-7xl text-red-800 font-black mb-2 drop-shadow-2xl">VOCÊ CAIU</h2>
              <p className="text-slate-500 mb-10 italic text-center tracking-widest">Blackwood consumiu mais uma alma no Nível {floor}.</p>
              <button onClick={()=>window.location.reload()} className="px-12 py-4 bg-red-900 text-white font-black hover:bg-red-700 transition-all rounded-full uppercase tracking-[0.3em] border-2 border-red-600/30">Renascer</button>
            </div>
          )}

          {p.sp > 0 && (
            <div className="fixed inset-0 bg-black/90 backdrop-blur-md flex items-center justify-center z-50 p-4">
              <div className="bg-slate-900 border-2 border-red-600 p-10 rounded-3xl text-center max-w-sm w-full shadow-[0_0_100px_rgba(220,38,38,0.3)]">
                <h2 className="text-3xl text-red-500 font-black mb-2 uppercase italic">Evolução</h2>
                <p className="text-slate-500 text-[10px] mb-8 tracking-[0.2em]">O SANGUE DA FLORESTA TE FORTALECE</p>
                <div className="flex flex-col gap-4 text-xs font-black uppercase">
                  <button onClick={()=>setP(prev=>({...prev, max:prev.max+10, hp:prev.hp+10, sp:prev.sp-1}))} className="w-full bg-red-950/40 border-2 border-red-600 text-red-500 py-5 rounded-2xl hover:bg-red-600 hover:text-white transition-all">🌿 Vitalidade (+10 HP)</button>
                  <button onClick={()=>setP(prev=>({...prev, atk:prev.atk+2, sp:prev.sp-1}))} className="w-full bg-slate-950/40 border-2 border-slate-700 text-slate-400 py-5 rounded-2xl hover:bg-white hover:text-black transition-all">⚔️ Brutalidade (+2 Atk)</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
